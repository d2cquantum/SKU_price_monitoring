<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OH 앱 목록</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#777; --line:#ddd; --accent:#1f4bd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#999; --line:#333; --accent:#7f9cff; }
  }
  * { box-sizing:border-box; border-radius:0; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:480px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:20px; margin:0 0 24px; }
  a { display:block; padding:16px 0; border-top:1px solid var(--line); color:var(--fg); text-decoration:none; }
  a:last-of-type { border-bottom:1px solid var(--line); }
  a b { display:block; font-size:16px; color:var(--accent); }
  a span { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>앱 목록</h1>
  <a href="household-budget/"><b>우리집 가계부</b><span>/household-budget/</span></a>
  <a href="sku-price-monitoring/"><b>삼성 SKU 가격 모니터링</b><span>/sku-price-monitoring/</span></a>
  <a href="chick-garden/"><b>병아리 정원</b><span>/chick-garden/ · 식물 관리 (준비 중)</span></a>
</main>
</body>
</html>
