<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>병아리 정원</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#777; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; } }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:480px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; margin:0; }
</style>
</head>
<body>
<main>
  <h1>병아리 정원</h1>
  <p>식집사를 위한 식물 관리 앱 — 준비 중</p>
</main>
</body>
</html>
