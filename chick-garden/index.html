      else if (pickFor === 'log' && sheet) { syncSheet(); sheet.photo = data; renderSheet(); }
    } catch (err) { toast(err.message); }
  });

  function syncDraft() {
    const f = $('#plantForm'); if (!f || !draft) return;
    draft.values = Object.fromEntries(new FormData(f));
    draft.values.checkMode = f.checkMode.checked;
    draft.every = f.waterEvery.value;
  }
  // 다시 그린 폼에 입력하던 값 되살리기
  function restoreDraft() {
    const f = $('#plantForm'); if (!f || !draft || !draft.values) return;
    for (const [k, v] of Object.entries(draft.values)) {
      if (!f[k]) continue;
      if (f[k].type === 'checkbox') f[k].checked = !!v; else f[k].value = v;
    }
  }

  /* ───────── 동작 ───────── */
  function go(patch) {
    Object.assign(ui, patch);
    render();
    window.scrollTo(0, 0);
  }
  const navStack = [];
  function pushNav(patch) {
    navStack.push({ tab: ui.tab, plant: ui.plant, edit: ui.edit, day: ui.day });
    history.pushState({ cg: navStack.length }, '');
    go(patch);
  }
  function back() {
    if (navStack.length) history.back();
    else { draft = null; go({ edit: null, plant: null, day: null }); }
  }
  const closeLayer = () => { sheet = null; $('#layer').innerHTML = ''; };
  window.addEventListener('popstate', () => {
    if ($('#layer').innerHTML) { closeLayer(); history.pushState({ cg: navStack.length }, ''); return; }
    const prev = navStack.pop();
    draft = null;
    go(prev || { edit: null, plant: null, day: null });
  });

  function water(ids) {
    const added = ids.map(id => addLog(id, 'water'));
    save(); render();
    const names = ids.map(id => plantById(id).name);
    toast((names.length > 1 ? names.length + '개 식물' : names[0]) + '에 물 준 걸 기록했어요', () => { removeLogs(added.map(l => l.id)); save(); render(); });
  }

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'closeSheet') { if (e.target === el || el.classList.contains('x')) closeLayer(); return; }
    if (el.tagName === 'A') e.preventDefault();
    switch (act) {
      case 'tab':
        navStack.length = 0; draft = null; closeLayer();
        if (id === 'calendar' && ui.tab !== 'calendar') ui.cal.cursor = today();
        go({ tab: id, plant: null, edit: null, day: null }); break;
      case 'toLogs': pushNav({ tab: 'logs' }); break;
      case 'calOf': navStack.length = 0; Object.assign(ui.cal, { mode: 'month', cursor: el.dataset.d || today() }); go({ tab: 'calendar', plant: null, edit: null, day: null }); break;
      case 'calMode': ui.cal.mode = el.dataset.v; if (ui.cal.cursor.slice(0, 7) === today().slice(0, 7)) ui.cal.cursor = today(); render(); break;
      case 'calToday': ui.cal.cursor = today(); render(); break;
      case 'calStep': { const n = Number(el.dataset.n); ui.cal.cursor = ui.cal.mode === 'week' ? addDays(ui.cal.cursor, 7 * n) : shiftMonth(ui.cal.cursor, n); render(); break; }
      case 'day': pushNav({ day: el.dataset.d }); break;
      case 'dayStep': ui.day = addDays(ui.day, Number(el.dataset.n)); ui.cal.cursor = ui.day; render(); break;
      case 'nk': {
        const d = el.dataset.d;
        if (d > today()) { if (!ui.day) pushNav({ day: d }); else toast('아직 오지 않은 날이에요'); break; }
        toggleWater(id, d); break;
      }
      case 'addPhoto': openLogSheet(null, 'photo', el.dataset.d); break;
      case 'addSticker': openLogSheet(null, 'sticker', el.dataset.d); break;
      case 'stk': syncSheet(); sheet.sticker = el.dataset.v; renderSheet(); break;
      case 'choosePhoto': closeLayer(); openLogSheet(ui.plant || null, 'photo', ui.day); break;
      case 'chooseSticker': closeLayer(); openLogSheet(ui.plant || null, 'sticker', ui.day); break;
      case 'newGroup': openGroupSheet(); break;
      case 'renameGroup': openGroupSheet(id); break;
      case 'delGroup': {
        const g = S.groups.find(x => x.id === id); if (!g) break;
        if (!confirm('"' + g.name + '" 그룹을 지울까요? 식물은 지워지지 않고 "그룹 없음"으로 옮겨져요.')) break;
        S.groups = S.groups.filter(x => x.id !== id); S.plants.forEach(p => { if (p.group === id) p.group = ''; });
        ui.group = ''; save(); render(); toast('그룹을 지웠어요'); break;
      }
      case 'groupFilter': ui.group = id || ''; render(); break;
      case 'albumMode': ui.album.mode = el.dataset.v; ui.album.sel = null; render(); break;
      case 'albumPlant': ui.album.plant = id; ui.album.sel = null; render(); break;
      case 'albumOf': navStack.length = 0; closeLayer(); Object.assign(ui.album, { mode: 'plant', plant: id, sel: null }); go({ tab: 'album', plant: null, edit: null, day: null }); break;
      case 'albumSel': {
        const a = ui.album, c = albumCandidates();
        if (!a.sel) a.sel = albumSelected(c).map(x => x.l.id);
        const i = a.sel.indexOf(id);
        if (i >= 0) a.sel.splice(i, 1);
        else if (a.sel.length >= 9) { toast('최대 9장까지 고를 수 있어요'); break; }
        else a.sel.push(id);
        render(); break;
      }
      case 'collage': {
        const sel = albumSelected(albumCandidates()); if (!sel.length) break;
        try {
          const items = [];
          for (const x of sel) { const src = await photoGet(x.l.photo); if (src) items.push({ src, cap: x.cap }); }
          const m = albumMeta(sel);
          const url = (await makeCollage(items, m.title, m.sub)).toDataURL('image/jpeg', 0.92);
          collage = { url, name: m.file + '.jpg', title: m.title };
          $('#layer').innerHTML = '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="콜라주 미리보기"><h3><span class="grow">콜라주 미리보기</span><button type="button" class="x" data-act="closeSheet" aria-label="닫기">' + ico('x') + '</button></h3>' +
            '<div class="preview"><img alt="' + esc(m.title) + ' 콜라주" src="' + url + '"></div><div class="btns" style="margin-top:14px"><button type="button" class="btn primary" data-act="shareCollage">' + ico('share') + '공유하기</button><button type="button" class="btn" data-act="saveCollage">' + ico('down') + '저장</button></div>' +
            '<p class="hint">1080×1350 (인스타그램 세로 4:5) 크기예요.</p></div></div>';
        } catch (err) { toast('콜라주를 만들지 못했어요: ' + err.message); }
        break;
      }
      case 'shareCollage': if (collage) await shareFiles([await dataFile(collage.url, collage.name)], collage.title); break;
      case 'saveCollage': if (collage) { downloadFile(await dataFile(collage.url, collage.name)); toast('이미지를 저장했어요'); } break;
      case 'shareRaw': {
        const sel = albumSelected(albumCandidates()); if (!sel.length) break;
        const m = albumMeta(sel), files = [];
        for (let i = 0; i < sel.length; i++) { const src = await photoGet(sel[i].l.photo); if (src) files.push(await dataFile(src, m.file + '-' + (i + 1) + '.jpg')); }
        await shareFiles(files, m.title); break;
      }
      case 'back': back(); break;
      case 'open': closeLayer(); pushNav({ plant: id, edit: null }); break;
      case 'new': draft = null; pushNav({ edit: 'new' }); break;
      case 'edit': draft = null; pushNav({ edit: id }); break;
      case 'quick': openChooser(); break;
      case 'chooseLog': closeLayer(); openLogSheet(ui.plant || null, 'water', ui.day); break;
      case 'chooseNew': closeLayer(); draft = null; pushNav({ edit: 'new' }); break;
      case 'nextTip': ui.tip++; render(); break;
      case 'every': syncDraft(); draft.every = el.dataset.n; draft.values.waterEvery = el.dataset.n; render(); break;
      case 'pickPhoto': pickPhoto(el.dataset.for); break;
      case 'dropPhoto': syncDraft(); draft.newPhoto = null; draft.photo = null; render(); break;
      case 'dropLogPhoto': syncSheet(); sheet.photo = null; renderSheet(); break;
      case 'water': water([id]); break;
      case 'waterAll': water(waterDue().map(x => x.p.id)); break;
      case 'snooze': {
        const l = addLog(id, 'check', { note: '아직 촉촉해서 미룸' }); save(); render();
        toast(S.settings.recheck + '일 뒤에 다시 알려 드릴게요', () => { removeLogs([l.id]); save(); render(); }); break;
      }
      case 'fert': {
        const l = addLog(id, 'fertilize'); save(); render();
        toast('비료 준 걸 기록했어요', () => { removeLogs([l.id]); save(); render(); }); break;
      }
      case 'fertSkip': {
        const l = addLog(id, 'fertilize', { note: '건너뜀', skipped: true }); save(); render();
        toast('이번 비료는 건너뛰었어요', () => { removeLogs([l.id]); save(); render(); }); break;
      }
      case 'undoDone': {
        const l = S.logs.find(x => x.id === id); if (!l) break;
        removeLogs([id]); save(); render();
        toast('완료를 취소했어요', () => { S.logs.push(l); save(); render(); }); break;
      }
      case 'log': openLogSheet(id, el.dataset.type); break;
      case 'logPick': openLogSheet(ui.logPlant || null, ui.logType || 'water'); break;
      case 'delLog': {
        const l = S.logs.find(x => x.id === id); if (!l) break;
        S.logs = S.logs.filter(x => x.id !== id); save(); render();
        toast('기록을 지웠어요', () => { S.logs.push(l); save(); render(); });
        setTimeout(() => { if (l.photo && !S.logs.includes(l)) dropPhotoIfUnused(l.photo); }, 5500);
        break;
      }
      case 'view': {
        const src = await photoGet(el.dataset.phId); if (!src) break;
        $('#layer').innerHTML = '<div class="viewer" data-act="closeViewer" role="dialog" aria-label="사진 보기"><img alt="" src="' + src + '"><p>' + esc(el.dataset.cap || '') + '</p><p class="small">눌러서 닫기</p></div>';
        break;
      }
      case 'closeViewer': closeLayer(); break;
      case 'archive': {
        const p = plantById(id); const note = prompt('보관하는 이유를 적어 두세요 (선택)', '');
        if (note === null) break;
        p.archived = true; p.archivedNote = note || '보관함'; save(); render(); toast('보관함으로 옮겼어요'); break;
      }
      case 'unarchive': { const p = plantById(id); p.archived = false; delete p.archivedNote; save(); render(); break; }
      case 'delPlant': {
        const p = plantById(id);
        if (!confirm('"' + p.name + '"과(와) 기록 ' + logsOf(id).length + '건, 사진을 모두 지울까요? 되돌릴 수 없어요.')) break;
        S.plants = S.plants.filter(x => x.id !== id);
        removeLogs(logsOf(id).map(l => l.id));
        dropPhotoIfUnused(p.photo); save();
        navStack.length = 0; go({ plant: null, edit: null, tab: 'plants' }); toast('삭제했어요'); break;
      }
      case 'theme': S.settings.theme = el.dataset.v; save(); render(); break;
      case 'signIn': signIn(); break;
      case 'signOut':
        if (!confirm(S.family ? '로그아웃할까요? 이 휴대폰은 가족 정원 대신 원래 데이터로 돌아가요. 가족 정원의 기록은 그대로 남아요.' : '로그아웃할까요?')) break;
        signOut(); break;
      case 'createFamily': createFamily(($('#famName') || {}).value); break;
      case 'joinFamily': joinFamily(($('#joinCode') || {}).value); break;
      case 'invite': makeInvite(); break;
      case 'shareInvite': shareInvite(); break;
      case 'leaveFamily':
        if (!confirm('가족 정원에서 나갈까요? 함께 쓰던 기록은 가족 정원에 남고, 이 휴대폰은 원래 데이터로 돌아가요.')) break;
        leaveFamily(); break;
      case 'export': exportBackup(); break;
      case 'import': $('#fileBackup').value = ''; $('#fileBackup').click(); break;
      case 'sample': if (S.family) break; await seed(); save(); go({ tab: 'today', plant: null, edit: null }); toast('예시 식물 4개를 넣었어요'); break;
      case 'clearSample':
        if (!confirm('예시 식물과 기록을 지우고 빈 정원으로 시작할까요?')) break;
        await wipe(); go({ tab: 'today' }); break;
      case 'reset':
        if (!confirm('모든 식물·기록·사진을 지울까요? 백업 파일이 없으면 되돌릴 수 없어요.')) break;
        await wipe(); go({ tab: 'today', plant: null, edit: null }); toast('모두 지웠어요'); break;
    }
  });

  async function wipe() {
    await photoClear();
    const theme = S.settings.theme;
    S = defaults(); S.settings.theme = theme; save();
  }

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'logType') { ui.logType = t.value; render(); }
    else if (t.id === 'logPlant') { ui.logPlant = t.value; render(); }
    else if (t.id === 'lType') { syncSheet(); sheet.type = t.value; if (sheet.plantId === '' && !HOME_OK.includes(sheet.type)) sheet.plantId = (active()[0] || {}).id || ''; renderSheet(); }
    else if (t.id === 'albumDate') { ui.album.date = isDate(t.value) && t.value <= today() ? t.value : today(); ui.album.sel = null; render(); }
    else if (t.id === 'fLastW') updateCalc();
    else if (t.closest('#setForm')) {
      const f = $('#setForm');
      S.settings.winter = f.winter.checked;
      S.settings.winterFactor = Number(f.winterFactor.value);
      S.settings.recheck = Number(f.recheck.value);
      S.settings.fertGrowOnly = f.fertGrowOnly.checked;
      save(); toast('설정을 저장했어요');
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'fEvery') { document.querySelectorAll('[data-act="every"]').forEach(c => c.classList.toggle('on', c.dataset.n === e.target.value)); updateCalc(); }
    if (e.target.id === 'q') {
      ui.q = e.target.value; const pos = e.target.selectionStart;
      render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener('submit', async e => {
    e.preventDefault();
    if (e.target.id === 'plantForm') await savePlant(e.target);
    else if (e.target.id === 'logForm') await saveLog();
    else if (e.target.id === 'groupForm') {
      const name = e.target.g.value.trim(); if (!name) return;
      const gid = e.target.dataset.gid;
      if (S.groups.some(x => x.name === name && x.id !== gid)) { toast('같은 이름의 그룹이 있어요'); return; }
      if (gid) S.groups.find(x => x.id === gid).name = name;
      else {
        const g = { id: nid('g'), name, at: Date.now() }; S.groups.push(g);
        if (ui.edit && draft) { syncDraft(); draft.values.group = g.id; }
        else if (ui.tab === 'plants' && !ui.plant) ui.group = g.id;
      }
      save(); closeLayer(); render(); toast(gid ? '그룹 이름을 바꿨어요' : '"' + name + '" 그룹을 만들었어요');
    }
  });

  async function savePlant(f) {
    const v = Object.fromEntries(new FormData(f));
    const species = (v.species || '').trim(), name = (v.name || '').trim() || species;
    if (!name) { f.elements.species.focus(); toast('식물 이름을 적어 주세요'); return; }
    const isNew = ui.edit === 'new';
    const p = isNew ? { id: nid('p'), created: today() } : plantById(ui.edit);
    Object.assign(p, {
      name, species, group: v.group || '', temp: (v.temp || '').trim(), humidity: v.humidity || '', location: v.location.trim(), light: v.light,
      waterEvery: Math.min(120, Math.max(1, parseInt(v.waterEvery, 10) || 7)),
      checkMode: f.checkMode.checked,
      fertEvery: Math.min(365, Math.max(0, parseInt(v.fertEvery, 10) || 0)),
      potMaterial: v.potMaterial, potSize: v.potSize.trim(), soil: v.soil.trim(),
      acquired: isDate(v.acquired) ? v.acquired : '', price: Math.max(0, parseInt(v.price, 10) || 0) || '',
      source: v.source.trim(), memo: v.memo.trim(),
    });
    // 사진: 새로 골랐으면 저장, 뺐으면 삭제
    const oldPhoto = p.photo;
    if (draft && draft.newPhoto) {
      const pid = nid('ph'); await photoPut(pid, draft.newPhoto); p.photo = pid;
      // 대표 사진도 성장 사진 타임라인에 남김 (같은 사진을 공유)
      addLog(p.id, 'photo', { photo: pid, note: isNew ? '처음 데려온 날' : '대표 사진 변경' });
    } else if (draft && !draft.photo) p.photo = null;
    if (oldPhoto && oldPhoto !== p.photo) dropPhotoIfUnused(oldPhoto);
    if (isNew) {
      if (isDate(v.lastWater)) addLog(p.id, 'water', { date: v.lastWater, note: '등록할 때 입력' });
      S.plants.push(p);
    }
    if (S.sample && isNew) S.sample = false;
    save();
    draft = null;
    navStack.pop(); history.replaceState({ cg: navStack.length }, '');
    if (isNew) { navStack.push({ tab: ui.tab, plant: null, edit: null, day: ui.day }); go({ edit: null, plant: p.id }); toast(name + '을(를) 정원에 들였어요. 다음 물 줄 날이 캘린더에 표시돼요'); }
    else { go({ edit: null, plant: p.id }); toast('저장했어요'); }
  }

  async function saveLog() {
    syncSheet();
    const s = sheet; if (!s) return;
    if (s.plantId === '' ? !HOME_OK.includes(s.type) : !plantById(s.plantId)) { toast('식물을 골라 주세요'); return; }
    const okDate = isDate(s.date) && (s.type === 'sticker' || s.date <= today());
    const extra = { date: okDate ? s.date : today(), note: s.note.trim() };
    if (s.type === 'newleaf' && Number(s.count) > 0) extra.count = Math.min(99, parseInt(s.count, 10));
    if (s.type === 'sticker') extra.sticker = s.sticker || STICKERS[0];
    if (s.type === 'photo' && !s.photo && !extra.note) { toast('사진이나 메모를 넣어 주세요'); return; }
    if (s.photo) { const pid = nid('ph'); await photoPut(pid, s.photo); extra.photo = pid; }
    addLog(s.plantId, s.type, extra);
    closeLayer(); save(); render();
    toast(s.type === 'sticker' ? extra.sticker + ' 스티커를 붙였어요' : LOG_TYPES[s.type].label + ' 기록했어요');
  }

  /* ───────── 가족 정원 (Firebase) ───────── */
  // firebase-config.js에 설정이 있을 때만 gstatic에서 SDK를 불러온다. 없으면 지금처럼 이 기기에만 저장.
  // 데이터: households/{hid} {name, owner, members[], memberInfo{uid:{name}}}
  //         households/{hid}/plants·groups·logs/{id} = S의 각 항목 그대로, photos/{id} = {data: JPEG dataURL}
  //         invites/{code} {hid, by, expires}, users/{uid} {household}
  // 동기화: save()마다 S와 마지막으로 맞춘 상태(fam.synced)를 비교해 바뀐 문서만 쓰고, onSnapshot으로 받은 내용으로 S를 바꾼다.
  const FB_VER = '10.12.2';
  const COLLS = ['plants', 'groups', 'logs'];
  const STASH = 'cg-local-stash';   // 가족 정원에 들어가기 전 이 기기의 데이터
  const fam = { cfg: window.CG_FIREBASE || null, fb: null, user: undefined, hh: null, hid: null, ready: false, unsub: [], synced: {}, status: '', invite: null, busy: false };
  let pendingJoin = null;
  const AUTH_FLAG = 'cg-auth';          // 이 기기에서 로그인한 적이 있음 → 시작할 때 로그인 상태 확인
  const JOIN_KEY = 'cg-pending-join';   // 로그인하러 다녀오는 동안 초대 코드 보관
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  // 아이폰·아이패드(사파리 엔진): 홈 화면 앱에서는 로그인 팝업의 결과가 앱으로 돌아오지 않고,
  // 사파리가 다른 도메인(firebaseapp.com)의 저장소를 막아서 리디렉션 결과도 못 읽는다.
  // → 사이트 주소의 /__/auth/*를 Netlify가 Firebase로 프록시(netlify.toml)하고, 로그인 도메인을 사이트 주소로 바꿔 리디렉션 로그인.
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const sameSiteAuth = () => !!(fam.cfg && (fam.cfg.authProxyHosts || []).includes(location.hostname));
  const useRedirect = () => (isIOS() && sameSiteAuth()) || !!(fam.cfg && fam.cfg.forceRedirect && isEmu());
  const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']'
    : v && typeof v === 'object' ? '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}'

  const famOn = () => !!(S.family && fam.user && fam.user.uid === S.family.uid);

    if (!S.family) {
      return '<section class="card">' + head('아직 가족 정원이 없어요') + who +
        '<div class="f" style="margin:12px 0 8px"><label for="famName" class="small muted" style="font-weight:700">새 가족 정원 만들기</label><div class="inline"><input type="text" id="famName" maxlength="20" placeholder="우리집 정원" value=""><button type="button" class="btn primary sm" data-act="createFamily"' + (fam.busy ? ' disabled' : '') + '>만들기</button></div>' +
        '<span class="hint">이 휴대폰의 식물과 기록이 가족 정원으로 옮겨져요.</span></div>' +
        '<div class="f" style="margin:12px 0 0"><label for="joinCode" class="small muted" style="font-weight:700">초대 코드로 들어가기</label><div class="inline"><input type="text" id="joinCode" maxlength="12" placeholder="예: K7P2QX" autocapitalize="characters" value="' + esc(pendingJoin || '') + '"><button type="button" class="btn sm" data-act="joinFamily"' + (fam.busy ? ' disabled' : '') + '>참여</button></div></div></section>';
    }
    const members = (fam.hh && fam.hh.members) || [S.family.uid];
    const off = !fam.ready || /오프라인|오류|로그아웃/.test(fam.status);
    let h = '<section class="card">' + head(esc(S.family.name || '우리집 정원'), '<span class="famline"><i class="' + (off ? 'off' : '') + '"></i>' + esc(fam.status || '연결 중…') + '</span>');
    h += '<div style="margin-bottom:6px">' + members.map(uid => '<div class="member"><span class="avatar">' + esc(memberName(uid).slice(0, 1)) + '</span><div class="body" style="flex:1;min-width:0"><div class="small" style="font-weight:700">' + esc(memberName(uid)) + (uid === fam.user.uid ? ' <span class="hint">(나)</span>' : '') + '</div>' +
      (uid === (fam.hh && fam.hh.owner) ? '<div class="hint">정원을 만든 사람</div>' : '') + '</div>' + (uid === fam.user.uid ? '<button type="button" class="pill-btn" data-act="signOut">로그아웃</button>' : '') + '</div>').join('') + '</div>';
    if (fam.invite) h += '<p class="small muted" style="margin:6px 0 0">가족에게 이 코드나 링크를 보내 주세요 (7일 동안 유효)</p><div class="code" aria-label="초대 코드">' + esc(fam.invite) + '</div>' +
      '<div class="btns"><button type="button" class="btn primary sm" data-act="shareInvite">' + ico('share') + '초대 링크 보내기</button><button type="button" class="btn sm" data-act="invite">새 코드</button></div>';
    else h += '<button type="button" class="btn primary block" data-act="invite"' + (fam.ready ? '' : ' disabled') + '>' + ico('link') + '가족 초대하기</button>';
    h += '<p style="margin:12px 0 0"><button type="button" class="linkbtn" data-act="leaveFamily">가족 정원에서 나가기</button></p></section>';
    return h;
  }

  /* ───────── 백업 ───────── */
  async function exportBackup() {
    try {
      const ids = new Set(); S.plants.forEach(p => p.photo && ids.add(p.photo)); S.logs.forEach(l => l.photo && ids.add(l.photo));
      const photos = {};
      for (const id of ids) { const v = await photoGet(id); if (v) photos[id] = v; }
      S.lastBackup = new Date().toISOString();
      const data = { app: 'chick-garden', v: 1, exported: S.lastBackup, state: S, photos };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chick-garden-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      save(); render();
      toast('백업 파일을 저장했어요 (' + (blob.size / 1048576).toFixed(1) + 'MB)');
    } catch (err) { toast('백업에 실패했어요: ' + err.message); }
  }
  $('#fileBackup').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || data.app !== 'chick-garden' || !data.state || !Array.isArray(data.state.plants)) throw new Error('병아리 정원 백업 파일이 아니에요');
      const st = data.state;
      if (!confirm('백업(' + (data.exported ? fmtDate(data.exported.slice(0, 10)) : '날짜 모름') + ', 식물 ' + st.plants.length + '개 · 기록 ' + (st.logs || []).length + '건)으로 지금 데이터를 바꿀까요?' + (S.family ? '\n가족 정원 전체가 이 백업으로 바뀌어요.' : ''))) return;
      if (!S.family) await photoClear();
      for (const [k, v] of Object.entries(data.photos || {})) if (typeof v === 'string' && v.startsWith('data:image/')) await photoPut(k, v);
      if (S.family) {   // 가족 정원: 식물·그룹·기록만 바꾸고 가족 연결은 유지
        S.plants = st.plants; S.groups = Array.isArray(st.groups) ? st.groups : []; S.logs = Array.isArray(st.logs) ? st.logs : [];
      } else {
        const d = defaults();
        S = Object.assign(d, st, { settings: Object.assign(d.settings, st.settings || {}), logs: Array.isArray(st.logs) ? st.logs : [], family: null });
      }
      save(); navStack.length = 0; go({ tab: 'today', plant: null, edit: null, day: null });
      toast('백업을 불러왔어요');
    } catch (err) { toast('불러오기 실패: ' + err.message); }
  });

  /* ───────── 예시 데이터 ───────── */
  // 예시 사진: 화분 그림을 크기만 바꿔 그려서 "자라는 모습"을 흉내 냄
  async function samplePhoto(scale, hue) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><defs><radialGradient id="b" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="' + hue + '"/><stop offset="1" stop-color="#0B2B26"/></radialGradient></defs><rect width="600" height="600" fill="url(#b)"/>' +
      '<g transform="translate(300 300) scale(' + scale + ') translate(-60 -78)">' + ART_PLANT.replace(/^<svg[^>]*>/, '').replace('</svg>', '') + '</g></svg>';
    const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
    const c = document.createElement('canvas'); c.width = c.height = 600; c.getContext('2d').drawImage(img, 0, 0, 600, 600);
    return c.toDataURL('image/jpeg', 0.8);
  }
  async function seed() {
    const t = today();
    const g1 = { id: nid('g'), name: '거실 친구들', at: 1 }, g2 = { id: nid('g'), name: '베란다 텃밭', at: 2 };
    S.groups.push(g1, g2);
    const mk = (name, species, extra) => {
      const p = Object.assign({ id: nid('p'), name, species, group: '', location: '', light: '', waterEvery: 7, checkMode: false, fertEvery: 0, created: addDays(t, -120) }, extra);
      S.plants.push(p); return p;
    };
    const a = mk('몬순이', '몬스테라 델리시오사', { group: g1.id, location: '거실 창가', light: '밝은 간접광', temp: '18~27℃', humidity: HUMID[1], waterEvery: 7, fertEvery: 30, acquired: addDays(t, -400), potMaterial: '플라스틱', potSize: '지름 21cm', soil: '상토 6 : 펄라이트 4', source: '동네 화원', price: 25000, memo: '잎이 처지면 물 줄 때. 새잎은 창 쪽으로 나옴.' });
    const b = mk('스투키', '산세베리아 스투키', { location: '침실', light: '반그늘', temp: '15~30℃', humidity: HUMID[0], waterEvery: 21, checkMode: true, acquired: addDays(t, -800), potMaterial: '세라믹', source: '집들이 선물' });
    const c = mk('바질', '스위트 바질', { group: g2.id, location: '베란다', light: '직광', temp: '20~30℃', waterEvery: 2, fertEvery: 14, acquired: addDays(t, -40), source: '씨앗 파종' });
    const d = mk('필레아', '필레아 페페로미오이데스', { group: g1.id, location: '주방', light: '밝은 간접광', waterEvery: 5, acquired: addDays(t, -200), source: '친구 나눔' });
    const L = (p, type, ago, extra) => addLog(p ? p.id : '', type, Object.assign({ date: addDays(t, -ago) }, extra));
    L(a, 'water', 8); L(a, 'water', 15); L(a, 'water', 22); L(a, 'fertilize', 32, { note: '하이포넥스 1000배' }); L(a, 'newleaf', 10, { count: 1, note: '찢잎 나옴!' }); L(a, 'repot', 120, { note: '18cm → 21cm' });
    L(b, 'water', 22); L(b, 'check', 1, { note: '아직 촉촉해서 미룸' });
    L(c, 'water', 1); L(c, 'water', 3); L(c, 'water', 5); L(c, 'prune', 3, { note: '꽃대 제거' });
    L(d, 'water', 5); L(d, 'water', 10); L(d, 'newleaf', 4, { count: 2 }); L(d, 'pest', 30, { note: '잎 뒷면 응애 → 물샤워' });
    L(a, 'sticker', 2, { sticker: '🌿', note: '새잎이 또 말려 나오는 중' });
    L(null, 'sticker', 6, { sticker: '☀️', note: '정원 대청소 완료!' });
    L(c, 'sticker', -3, { sticker: '🍃', note: '바질 수확해서 페스토 만들기' });
    try {
      const shots = [[a, 300, 1.4, '#235347'], [a, 200, 1.7, '#235347'], [a, 120, 2.0, '#2b5f50'], [a, 60, 2.3, '#2f6a58'], [a, 3, 2.6, '#35705c'],
        [d, 12, 2.2, '#3b6d5c'], [c, 4, 2.3, '#4a7a52'], [b, 20, 2.0, '#25463d']];
      for (const [p, ago, scale, hue] of shots) {
        const pid = nid('ph'); await photoPut(pid, await samplePhoto(scale, hue));
        L(p, 'photo', ago, { photo: pid, note: '예시 사진' });
        p.photo = pid;
      }
    } catch (e) { console.warn('sample photos', e); }
    S.sample = true;
  }

  /* ───────── 시작 ───────── */
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !ui.edit && !$('#layer').innerHTML) render(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLayer();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  });

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  const jm = location.hash.match(/join=([A-Za-z0-9]{4,12})/);
  if (jm) { pendingJoin = jm[1].toUpperCase(); lsSet(JOIN_KEY, pendingJoin); }
  else if (lsGet(JOIN_KEY)) pendingJoin = lsGet(JOIN_KEY);
  if (pendingJoin && fam.cfg) ui.tab = 'settings';
  if (fam.cfg && (S.family || pendingJoin || lsGet(AUTH_FLAG))) fbLoad().catch(e => { fam.status = '연결 실패 (' + e.message + ')'; render(); });
  render();
  updateBadge();

  // 테스트용 훅
  window.__cg = { waterInfo, fertInfo, dueLabel, addDays, diffDays, calEvents, get state() { return S; }, get fam() { return { user: fam.user && fam.user.uid, ready: fam.ready, status: fam.status, hid: fam.hid, invite: fam.invite, members: fam.hh && fam.hh.members, ios: isIOS(), standalone: isStandalone(), redirect: useRedirect(), authDomain: fam.fb && fam.fb.app.options.authDomain }; } };
  // 에뮬레이터(localhost)에서만: 가짜 구글 토큰으로 로그인 (자동 테스트용)
  if (isEmu()) window.__cg.testSignIn = async claims => { const { Au, auth } = await fbLoad(); await Au.signInWithCredential(auth, Au.GoogleAuthProvider.credential(JSON.stringify(claims))); };
})();
</script>
</body>
