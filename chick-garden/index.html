<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>병아리 정원</title>
<meta name="description" content="식집사를 위한 식물 관리 앱. 데이터는 이 기기에만 저장됩니다.">
<meta name="theme-color" content="#DAF1DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#051F20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* 팔레트: #051F20 · #0B2B26 · #163832 · #235347 · #8EB69B · #DAF1DE
     상태 표시용 보조색 두 가지만 추가: 해바라기(오늘), 테라코타(지남) */
  :root {
    --c1:#051F20; --c2:#0B2B26; --c3:#163832; --c4:#235347; --c5:#8EB69B; --c6:#DAF1DE;
    --bg:var(--c6);
    --surface:#F1FAF3;
    --surface-2:#E5F4E8;
    --fg:var(--c1);
    --muted:var(--c4);
    --line:rgba(35,83,71,.16);
    --accent:var(--c4); --accent-ink:var(--c6);
    --tile:rgba(142,182,155,.28); --tile-fg:var(--c4);
    --deep:var(--c2); --deep-2:var(--c3); --deep-fg:var(--c6); --deep-muted:var(--c5); --deep-line:rgba(142,182,155,.18);
    --glow:rgba(142,182,155,.55);
    --shadow:0 10px 28px rgba(11,43,38,.10);
    --sun:#B98A12; --sun-soft:rgba(233,185,73,.22);
    --alert:#B5452C; --alert-soft:rgba(196,84,58,.13);
    --r-lg:24px; --r-md:16px; --r-sm:12px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:var(--c1); --surface:var(--c2); --surface-2:var(--c3);
      --fg:var(--c6); --muted:var(--c5); --line:rgba(142,182,155,.16);
      --accent:var(--c5); --accent-ink:var(--c1);
      --tile:rgba(142,182,155,.14); --tile-fg:var(--c5);
      --deep:var(--c3); --deep-2:var(--c4); --deep-line:rgba(218,241,222,.14);
      --glow:rgba(142,182,155,.35); --shadow:0 10px 28px rgba(0,0,0,.35);
      --sun:#F0C75A; --sun-soft:rgba(240,199,90,.16);
      --alert:#EE8C6E; --alert-soft:rgba(238,140,110,.15);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:var(--c1); --surface:var(--c2); --surface-2:var(--c3);
    --fg:var(--c6); --muted:var(--c5); --line:rgba(142,182,155,.16);
    --accent:var(--c5); --accent-ink:var(--c1);
    --tile:rgba(142,182,155,.14); --tile-fg:var(--c5);
    --deep:var(--c3); --deep-2:var(--c4); --deep-line:rgba(218,241,222,.14);
    --glow:rgba(142,182,155,.35); --shadow:0 10px 28px rgba(0,0,0,.35);
    --sun:#F0C75A; --sun-soft:rgba(240,199,90,.16);
    --alert:#EE8C6E; --alert-soft:rgba(238,140,110,.15);
    color-scheme:dark;
  }

  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body {
    margin:0; color:var(--fg); min-height:100vh;
    background:
      radial-gradient(520px 380px at -10% -5%, var(--glow), transparent 70%),
      radial-gradient(420px 360px at 115% 40%, var(--glow), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size:15px; line-height:1.5; letter-spacing:-.01em; word-break:keep-all; overflow-wrap:anywhere; -webkit-tap-highlight-color:transparent;
  }
  button, input, select, textarea { font:inherit; color:inherit; letter-spacing:inherit; }
  img { display:block; }
  svg.i { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #app { max-width:480px; margin:0 auto; padding:0 16px calc(104px + env(safe-area-inset-bottom)); }

  /* 머리 */
  header.top { display:flex; align-items:center; gap:10px; padding:18px 0 14px; }
  header.top h1 { font-size:24px; font-weight:800; margin:0; flex:1; min-width:0; letter-spacing:-.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.top h1 small { display:block; font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; margin-top:-2px; overflow:hidden; text-overflow:ellipsis; }
  .round { width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; color:var(--fg); position:relative; box-shadow:var(--shadow); padding:0; }
  .round .dot { position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; border-radius:9px; background:var(--alert); color:#fff; font-size:10px; font-weight:800; line-height:18px; text-align:center; padding:0 4px; border:2px solid var(--bg); }

  /* 카드 */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:18px; margin-bottom:14px; }
  .card.flush { padding:6px 0; }
  .card-h { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .card.flush .card-h { padding:12px 18px 0; margin-bottom:2px; }
  .card-h h2 { font-size:16px; font-weight:800; margin:0; flex:1; letter-spacing:-.02em; }
  .card-h h2 small { display:block; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .pill-btn { border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; color:var(--fg); }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .hint { font-size:12px; color:var(--muted); }

  /* 진한 카드 (히어로·통계) */
  .deep { background:
      radial-gradient(260px 160px at 85% 15%, rgba(142,182,155,.28), transparent 70%),
      linear-gradient(150deg, var(--deep-2), var(--deep));
    color:var(--deep-fg); border:1px solid var(--deep-line); border-radius:var(--r-lg); box-shadow:var(--shadow); }
  .hero { position:relative; overflow:hidden; padding:20px; margin-bottom:14px; display:flex; gap:10px; align-items:center; min-height:168px; }
  .hero .txt { flex:1; min-width:0; position:relative; z-index:1; }
  .hero h2 { margin:0 0 6px; font-size:20px; font-weight:800; letter-spacing:-.03em; }
  .hero p { margin:0 0 14px; color:var(--deep-muted); font-size:14px; }
  .hero p b { color:var(--deep-fg); }
  .hero .art { width:116px; flex:none; position:relative; }
  .hero .art::before { content:""; position:absolute; inset:10% 5% 0; border-radius:50%; background:radial-gradient(circle, rgba(142,182,155,.55), transparent 65%); filter:blur(6px); }
  .hero .art svg { position:relative; width:100%; height:auto; }
  .cta { display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(218,241,222,.28); background:rgba(218,241,222,.1); color:var(--deep-fg); border-radius:999px; padding:10px 16px; font-weight:700; cursor:pointer; box-shadow:0 0 18px rgba(142,182,155,.25) inset; }

  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat { padding:14px; position:relative; overflow:hidden; text-align:left; cursor:pointer; font:inherit; }
  .stat .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .stat .lb { font-size:12px; color:var(--deep-muted); margin-top:10px; }
  .stat .val { font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1.15; }
  .stat .val small { font-size:14px; font-weight:600; margin-left:2px; }
  .stat .sub { font-size:12px; color:var(--deep-muted); }
  .stat .sub b { color:var(--c5); }
  .spark { width:64px; height:26px; overflow:visible; }
  .spark polyline { fill:none; stroke:var(--c5); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 4px rgba(142,182,155,.8)); }

  /* 아이콘 타일 */
  .tile { width:42px; height:42px; border-radius:14px; background:var(--tile); color:var(--tile-fg); display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .deep .tile { background:rgba(218,241,222,.1); color:var(--c6); border:1px solid rgba(218,241,222,.14); box-shadow:0 0 16px rgba(142,182,155,.25); }
  .tile.sm { width:34px; height:34px; border-radius:11px; }
  .tile.sm svg.i { width:17px; height:17px; }

  .thumb { width:46px; height:46px; border-radius:14px; flex:none; background:var(--tile); color:var(--tile-fg); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb.lg { width:100%; height:auto; aspect-ratio:4/3; border-radius:var(--r-lg); }
  .thumb.lg svg.i { width:64px; height:64px; stroke-width:1.2; }

  /* 목록 줄 */
  .rows > * + * { border-top:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:12px; padding:12px 18px; width:100%; text-align:left; border:0; background:none; color:inherit; font:inherit; cursor:pointer; text-decoration:none; }
  .row .body { flex:1; min-width:0; }
  .row .title { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .meta { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .due { font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .due.late { background:var(--alert-soft); color:var(--alert); }
  .due.today { background:var(--sun-soft); color:var(--sun); }
  .due.soon { background:var(--tile); color:var(--accent); }
  .due.later { background:var(--surface-2); color:var(--muted); }

  /* 오늘 할 일 */
  .progress { height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden; margin:2px 0 6px; }
  .progress i { display:block; height:100%; background:linear-gradient(90deg, var(--c4), var(--c5)); border-radius:2px; box-shadow:0 0 8px var(--glow); }
  .task { display:flex; align-items:center; gap:10px; padding:10px 0; }
  .task + .task { border-top:1px solid var(--line); }
  .chk { width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; padding:0; color:var(--accent-ink); }
  .chk svg.i { width:16px; height:16px; stroke-width:2.6; opacity:0; }
  .chk:hover svg.i { opacity:.35; color:var(--accent); }
  .chk.on { background:var(--accent); border-color:var(--accent); }
  .chk.on svg.i { opacity:1; color:var(--accent-ink); }
  .task .body { flex:1; min-width:0; cursor:pointer; }
  .task .title { font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task .meta { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task.done .title { text-decoration:line-through; color:var(--muted); font-weight:600; }
  .task .side { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .linkbtn { border:0; background:none; padding:0; font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }

  /* 팁 배너 */
  .tip { display:flex; gap:12px; align-items:center; padding:16px 18px; margin-bottom:14px; }
  .tip .art { width:72px; flex:none; filter:drop-shadow(0 0 14px rgba(240,199,90,.35)); }
  .tip h3 { margin:0 0 2px; font-size:15px; font-weight:800; }
  .tip p { margin:0; font-size:13px; color:var(--deep-muted); }
  .tip .cta { padding:7px 12px; font-size:12px; margin-top:8px; }

  .note { border-radius:var(--r-md); padding:12px 14px; font-size:13px; margin-bottom:14px; display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--line); color:var(--muted); }
  .note.warn { background:var(--sun-soft); border-color:transparent; color:var(--fg); }
  .note .grow { flex:1; }

  .empty { text-align:center; padding:28px 12px 8px; color:var(--muted); }
  .empty .art { width:120px; margin:0 auto 6px; }
  .empty b { color:var(--fg); font-size:17px; }

  /* 버튼 */
  .btn { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:10px 16px; cursor:pointer; font-weight:700; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:6px; color:var(--fg); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); box-shadow:0 6px 18px rgba(35,83,71,.25); }
  .btn.danger { color:var(--alert); }
  .btn.sm { padding:6px 12px; font-size:13px; }
  .btn.block { width:100%; padding:13px; }
  .btn[disabled], .round[disabled] { opacity:.5; cursor:default; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }

  /* 식물 상세 */
  .mini { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 14px; }
  .mini div { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; }
  .mini b { display:block; font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .mini span { font-size:11px; color:var(--muted); }
  .sched { display:flex; gap:12px; align-items:center; padding:10px 0; }
  .sched + .sched { border-top:1px solid var(--line); }
  .sched .body { flex:1; min-width:0; }
  .sched .t { font-weight:700; font-size:14px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .sched .m { font-size:12px; color:var(--muted); }
  .acts { display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px; }
  .acts button { border:0; background:none; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--fg); }
  .acts .tile { width:48px; height:48px; border-radius:16px; }
  .strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x mandatory; }
  .strip figure { margin:0; flex:none; width:112px; scroll-snap-align:start; }
  .strip img { width:112px; height:112px; object-fit:cover; border-radius:var(--r-md); background:var(--tile); cursor:pointer; }
  .strip figcaption { font-size:11px; color:var(--muted); margin-top:3px; }
  dl.info { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:0; font-size:14px; }
  dl.info dt { color:var(--muted); font-size:13px; }
  dl.info dd { margin:0; word-break:break-all; font-weight:600; }

  /* 일지 */
  .tl .item { display:flex; gap:12px; padding:11px 0; align-items:flex-start; }
  .tl .item + .item { border-top:1px solid var(--line); }
  .tl .body { flex:1; min-width:0; }
  .tl .t { font-weight:700; font-size:14px; }
  .tl .t a { color:inherit; }
  .tl .d { color:var(--muted); font-size:12px; }
  .tl p { margin:2px 0 0; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .tl .body img { width:92px; height:92px; object-fit:cover; border-radius:var(--r-sm); margin-top:6px; cursor:pointer; }
  .x { border:0; background:none; color:var(--muted); cursor:pointer; padding:4px; line-height:0; border-radius:8px; }
  .x svg.i { width:16px; height:16px; }
  .day { font-size:12px; color:var(--muted); margin:4px 4px 8px; font-weight:700; }

  /* 검색·필터 */
  .search { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 14px; margin-bottom:14px; color:var(--muted); box-shadow:var(--shadow); }
  .search input[type=text] { border:0; background:none; min-height:44px; flex:1; outline:none; color:var(--fg); width:100%; padding:0; border-radius:0; }
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }

  /* 폼 */
  form .f { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  form label { font-size:12px; color:var(--muted); font-weight:700; }
  form .req::after { content:" *"; color:var(--alert); }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:var(--r-sm); padding:10px 12px; min-height:46px; color:var(--fg);
  }
  .filters select { background:var(--surface); border-radius:999px; padding:0 14px; box-shadow:var(--shadow); }
  textarea { min-height:76px; resize:vertical; }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, button:focus-visible { outline:2px solid var(--c5); outline-offset:1px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .check { display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--fg); font-weight:400; cursor:pointer; }
  .check input { width:20px; height:20px; margin:1px 0 0; accent-color:var(--c4); flex:none; }
  .photo-pick { display:flex; gap:12px; align-items:center; }
  .photo-pick .thumb { width:76px; height:76px; border-radius:var(--r-md); }

  /* 하단 탭 바 (떠 있는 알약) */
  nav.tabs { position:fixed; left:0; right:0; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:10; pointer-events:none; }
  nav.tabs .in { max-width:480px; margin:0 auto; padding:0 12px; display:flex; gap:8px; align-items:center; }
  nav.tabs .bar { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:6px; border-radius:999px; pointer-events:auto;
    background:linear-gradient(150deg, var(--c3), var(--c2)); border:1px solid rgba(142,182,155,.22); box-shadow:0 12px 30px rgba(5,31,32,.35); }
  nav.tabs .bar button { border:0; background:none; border-radius:999px; padding:7px 0; cursor:pointer; color:var(--c5); font-size:11px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:1px; position:relative; }
  nav.tabs .bar button svg.i { width:19px; height:19px; }
  nav.tabs .bar button.on { background:var(--c4); color:var(--c6); box-shadow:0 0 16px rgba(142,182,155,.35) inset; }
  nav.tabs .badge { position:absolute; top:2px; left:calc(50% + 6px); background:var(--alert); color:#fff; font-size:9px; font-weight:800; font-style:normal; border-radius:8px; min-width:16px; height:16px; line-height:16px; padding:0 4px; }
  nav.tabs .plus { pointer-events:auto; width:56px; height:56px; border-radius:50%; border:1px solid rgba(142,182,155,.3); cursor:pointer; color:var(--c6);
    background:radial-gradient(circle at 30% 25%, var(--c4), var(--c2)); box-shadow:0 12px 30px rgba(5,31,32,.35), 0 0 18px rgba(142,182,155,.35) inset; display:flex; align-items:center; justify-content:center; }
  nav.tabs .plus svg.i { width:24px; height:24px; stroke-width:2.2; }

  /* 시트·보기 */
  .sheet-bg { position:fixed; inset:0; background:rgba(5,31,32,.5); z-index:20; display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
  .sheet { background:var(--bg); width:100%; max-width:480px; max-height:92vh; overflow:auto; border-radius:var(--r-lg) var(--r-lg) 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin:0 0 14px; font-size:17px; font-weight:800; display:flex; align-items:center; gap:10px; }
  .sheet h3 .grow { flex:1; }
  .choose { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choose button { border:1px solid var(--line); background:var(--surface); border-radius:var(--r-md); padding:16px 12px; cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left; font-weight:700; }
  .choose button span:not(.tile) { font-size:12px; font-weight:500; color:var(--muted); }
  .viewer { position:fixed; inset:0; background:rgba(5,31,32,.94); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; color:var(--c6); }
  .viewer img { max-width:100%; max-height:80vh; object-fit:contain; border-radius:var(--r-md); }

  #toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:40; background:var(--c2); color:var(--c6); border:1px solid rgba(142,182,155,.25); border-radius:999px; padding:10px 16px; font-size:13px; display:none; align-items:center; gap:14px; max-width:calc(100% - 32px); box-shadow:0 10px 26px rgba(5,31,32,.35); }
  #toast.show { display:flex; }
  #toast button { border:0; background:none; color:var(--c5); font-weight:800; cursor:pointer; padding:0; white-space:nowrap; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="메뉴"><div class="in"><div class="bar" id="tabs"></div><button type="button" class="plus" data-act="quick" aria-label="추가하기"></button></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>
<input type="file" id="filePhoto" accept="image/*" class="sr" tabindex="-1">
<input type="file" id="fileBackup" accept="application/json,.json" class="sr" tabindex="-1">

<script>
(function () {
  'use strict';

  /* ───────── 아이콘 (선 아이콘, 24×24) ───────── */
  const ICONS = {
    drop: '<path d="M12 3.5c3.2 3.8 6 7.2 6 10.6a6 6 0 0 1-12 0c0-3.4 2.8-6.8 6-10.6z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/>',
    eye: '<path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>',
    flask: '<path d="M9 3h6M10 3v6.2L5 18a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-8.8V3"/><path d="M7.4 14.5h9.2"/>',
    pot: '<path d="M4 10h16l-1.8 10H5.8z"/><path d="M12 10V6"/><path d="M12 7c0-2 1.6-3.5 3.6-3.5 0 2-1.6 3.5-3.6 3.5zM12 8c0-1.8-1.4-3-3.2-3 0 1.8 1.4 3 3.2 3z"/>',
    scissors: '<circle cx="6" cy="6.5" r="2.8"/><circle cx="6" cy="17.5" r="2.8"/><path d="M8.4 8 20 18M8.4 16 20 6"/>',
    sparkle: '<path d="M11 3.5l1.7 4.8 4.8 1.7-4.8 1.7L11 16.5l-1.7-4.8L4.5 10l4.8-1.7z"/><path d="M18 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>',
    move: '<path d="M4 12h16M16 8l4 4-4 4M8 8l-4 4 4 4"/>',
    bug: '<rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 11v8M4 13h4M16 13h4M5 7.5l3 1.5M19 7.5l-3 1.5M5 19l3-1.5M19 19l-3-1.5M10 7a2 2 0 0 1 4 0"/>',
    leaf: '<path d="M5 19c0-8.3 6-14 15-14 0 9-5.7 15-14 15"/><path d="M5 19.5l8.5-8.5"/>',
    flower: '<circle cx="12" cy="10" r="2.2"/><path d="M12 7.8C10 5.5 10.5 3 12 3s2 2.5 0 4.8zM14.2 10c2.3-2 4.8-1.5 4.8 0s-2.5 2-4.8 0zM12 12.2c2 2.3 1.5 4.8 0 4.8s-2-2.5 0-4.8zM9.8 10C7.5 12 5 11.5 5 10s2.5-2 4.8 0z"/><path d="M12 17v4"/>',
    camera: '<path d="M4 8h3.2l1.8-2.6h6l1.8 2.6H20v11H4z"/><circle cx="12" cy="13.2" r="3.4"/>',
    note: '<path d="M6 3h9l4 4v14H6z"/><path d="M14.5 3v4.5H19M9 12h7M9 16h5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
    plant: '<path d="M12 20v-8"/><path d="M12 12c0-4.2-2.8-7-7-7 0 4.2 2.8 7 7 7zM12 10.5c0-4 2.8-6.5 7-6.5 0 4-2.8 6.5-7 6.5z"/><path d="M7 20h10"/>',
    book: '<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7h6"/>',
    sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    calendar: '<rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
    down: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
    up: '<path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/>',
    box: '<path d="M3.5 4.5h17v4h-17zM5 8.5V20h14V8.5M10 12.5h4"/>',
    snow: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 6.5l2.5-2M9.5 19.5 12 17.5l2.5 2"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  };
  const ico = name => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';

  // 일러스트: 화분 식물 / 병아리
  const ART_PLANT = '<svg viewBox="0 0 120 130" aria-hidden="true"><path d="M60 92V54" stroke="#8EB69B" stroke-width="4" stroke-linecap="round"/>' +
    '<path d="M60 70c-4-18-18-28-38-28 2 20 18 30 38 28z" fill="#8EB69B"/><path d="M60 70c-4-18-18-28-38-28" stroke="#DAF1DE" stroke-opacity=".5" stroke-width="1.5" fill="none"/>' +
    '<path d="M60 58c2-22 16-34 40-36-1 24-17 36-40 36z" fill="#DAF1DE"/><path d="M60 58c6-14 18-24 34-30" stroke="#235347" stroke-opacity=".5" stroke-width="1.5" fill="none"/>' +
    '<path d="M60 80c3-10 11-16 22-16-1 11-10 17-22 16z" fill="#8EB69B" opacity=".85"/>' +
    '<path d="M30 90h60l-7 36H37z" fill="#235347"/><path d="M27 86h66v10H27z" fill="#163832"/><path d="M27 86h66" stroke="#8EB69B" stroke-opacity=".6" stroke-width="2"/></svg>';
  const ART_CHICK = '<svg viewBox="0 0 120 110" aria-hidden="true"><ellipse cx="60" cy="102" rx="34" ry="5" fill="#051F20" opacity=".18"/>' +
    '<path d="M60 28c22 0 38 18 38 40s-16 34-38 34-38-12-38-34 16-40 38-40z" fill="#F2C94C"/>' +
    '<path d="M28 70c6 8 14 10 22 8-4-8-12-12-22-8z" fill="#E0B53A"/><path d="M92 70c-6 8-14 10-22 8 4-8 12-12 22-8z" fill="#E0B53A"/>' +
    '<circle cx="48" cy="56" r="4.5" fill="#051F20"/><circle cx="72" cy="56" r="4.5" fill="#051F20"/><circle cx="49.5" cy="54.5" r="1.4" fill="#fff"/><circle cx="73.5" cy="54.5" r="1.4" fill="#fff"/>' +
    '<path d="M54 64l6 7 6-7z" fill="#E07A3A"/><circle cx="40" cy="66" r="4" fill="#F0A0A0" opacity=".55"/><circle cx="80" cy="66" r="4" fill="#F0A0A0" opacity=".55"/>' +
    '<path d="M60 28c-2-8 2-14 8-16-1 6-3 10-8 16zM60 28c-4-6-10-8-14-6 3 4 8 6 14 6z" fill="#8EB69B"/></svg>';

  /* ───────── 상수 ───────── */
  const KEY = 'cg-v1';
  const LOG_TYPES = {
    water:    { label: '물주기',   ic: 'drop' },
    check:    { label: '흙 확인',  ic: 'eye' },
    fertilize:{ label: '비료',     ic: 'flask' },
    repot:    { label: '분갈이',   ic: 'pot' },
    prune:    { label: '가지치기', ic: 'scissors' },
    clean:    { label: '잎 닦기',  ic: 'sparkle' },
    move:     { label: '자리 이동', ic: 'move' },
    pest:     { label: '병해충',   ic: 'bug' },
    newleaf:  { label: '새잎',     ic: 'leaf' },
    flower:   { label: '꽃',       ic: 'flower' },
    photo:    { label: '사진',     ic: 'camera' },
    note:     { label: '메모',     ic: 'note' },
  };
  const QUICK = ['water','fertilize','repot','prune','clean','move','pest','newleaf','flower','photo','note','check'];
  const LIGHTS = ['직광', '밝은 간접광', '반그늘', '그늘'];
  const POTS = ['토분', '플라스틱', '세라믹', '유리', '기타'];
  const PLACES = ['거실 창가', '베란다', '침실', '주방', '욕실', '사무실'];
  const EVERY = [3, 5, 7, 10, 14, 21, 30];
  const WINTER = [12, 1, 2];        // 겨울철(물주기 간격을 늘리는 달)
  const GROW = [3,4,5,6,7,8,9,10];  // 생장기(비료 알림을 보내는 달)
  const TIPS = {
    winter: ['겨울엔 따뜻한 낮에, 실온에 둔 물로 주세요. 찬물은 뿌리를 놀라게 해요.', '난방기 바람이 잎에 바로 닿지 않는 자리로 옮겨 주세요.', '창가는 밤에 많이 차가워져요. 저녁엔 창에서 한 뼘 떨어뜨려 주세요.', '건조한 겨울엔 가습기나 물 받은 쟁반으로 습도를 올려 주세요.'],
    spring: ['생장기가 시작됐어요. 뿌리가 꽉 찼다면 분갈이하기 좋은 때예요.', '새잎이 나기 시작하면 비료를 묽게 시작해 보세요.', '햇빛이 강해지기 시작해요. 실내 식물은 조금씩 빛에 적응시켜 주세요.'],
    summer: ['장마철엔 흙이 늦게 말라요. 날짜보다 흙을 먼저 확인하세요.', '한여름 직광은 잎을 태울 수 있어요. 한낮엔 반그늘로 피해 주세요.', '더운 날엔 해 질 무렵이나 아침에 물을 주세요.'],
    fall: ['밤 기온이 15도 아래로 내려가면 베란다 식물을 실내로 들여 주세요.', '흙이 마르는 속도가 느려져요. 물주기 간격을 조금씩 늘려 주세요.', '겨울 오기 전 마지막 비료는 가을 초입까지만 주세요.'],
    any: ['잎 뒷면을 가끔 살펴보면 응애나 깍지벌레를 일찍 찾을 수 있어요.', '물은 화분 밑으로 흘러나올 만큼 흠뻑, 받침에 고인 물은 버려 주세요.', '같은 각도에서 사진을 남겨 두면 자라는 모습을 비교하기 좋아요.', '잎에 쌓인 먼지를 닦아 주면 광합성이 잘 돼요.'],
  };

  /* ───────── 날짜 ───────── */
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => ymd(new Date());
  const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);   // b - a
  const addDays = (s, n) => { const t = new Date(utc(s) + n * 864e5); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); };
  const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const WD = ['일','월','화','수','목','금','토'];
  const fmtDate = s => { const [y, m, d] = s.split('-').map(Number); const w = WD[new Date(y, m - 1, d).getDay()]; return (y === new Date().getFullYear() ? '' : y + '년 ') + m + '월 ' + d + '일 (' + w + ')'; };
  const fmtShort = s => { const [, m, d] = s.split('-').map(Number); return m + '/' + d; };
  const curMonth = () => new Date().getMonth() + 1;

  /* ───────── 상태 ───────── */
  const defaults = () => ({
    v: 1, seq: 1, sample: false, plants: [], logs: [], lastBackup: null,
    settings: { winter: true, winterFactor: 1.5, recheck: 2, fertGrowOnly: true, theme: 'auto' },
  });
  let S = load();
  const ui = { tab: 'today', plant: null, edit: null, logType: '', logPlant: '', q: '', tip: 0 };
  let draft = null;   // 등록/수정 폼의 사진 등 임시 값

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        const d = defaults();
        return Object.assign(d, s, { settings: Object.assign(d.settings, s.settings || {}) });
      }
    } catch (e) { console.warn('load failed', e); }
    return defaults();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('저장 공간이 부족해요. 설정에서 백업 후 정리해 주세요.'); }
    updateBadge();
  }
  const nid = p => p + (S.seq++).toString(36) + Date.now().toString(36).slice(-4);
  const plantById = id => S.plants.find(p => p.id === id);

  /* ───────── 사진 저장소 (IndexedDB) ───────── */
  const PH = new Map();   // 메모리 캐시: id → dataURL
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('cg-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function idb(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const tx = d.transaction('photos', mode);
      const req = fn(tx.objectStore('photos'));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
    });
  }
  const photoPut = (id, data) => { PH.set(id, data); return idb('readwrite', s => s.put(data, id)); };
  const photoDel = id => { PH.delete(id); return idb('readwrite', s => s.delete(id)).catch(() => {}); };
  async function photoGet(id) {
    if (PH.has(id)) return PH.get(id);
    const v = await idb('readonly', s => s.get(id)).catch(() => null);
    if (v) PH.set(id, v);
    return v;
  }
  async function photoAll() {
    const d = await db();
    return new Promise((res, rej) => {
      const out = {}; const tx = d.transaction('photos', 'readonly');
      tx.objectStore('photos').openCursor().onsuccess = e => { const c = e.target.result; if (c) { out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
    });
  }
  async function photoClear() { PH.clear(); await idb('readwrite', s => s.clear()).catch(() => {}); }

  // 사진을 긴 변 1000px JPEG로 줄여서 저장 (용량 절약)
  function compress(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했어요')); };
      img.src = url;
    });
  }
  function fillPhotos(root) {
    root.querySelectorAll('img[data-ph]').forEach(async el => {
      const v = await photoGet(el.dataset.ph);
      if (v) el.src = v; else el.remove();
    });
  }

  /* ───────── 계산 ───────── */
  const logsOf = (pid, type) => S.logs.filter(l => l.plantId === pid && (!type || l.type === type));
  function lastLog(pid, type) {
    let best = null;
    for (const l of S.logs) if (l.plantId === pid && l.type === type && (!best || l.date > best.date || (l.date === best.date && l.at > best.at))) best = l;
    return best;
  }
  const isWinter = () => S.settings.winter && WINTER.includes(curMonth());
  function waterEvery(p) {
    const n = Math.max(1, Number(p.waterEvery) || 7);
    return isWinter() ? Math.round(n * (Number(S.settings.winterFactor) || 1.5)) : n;
  }
  // 다음 물주기(또는 흙 확인) 날짜
  function waterInfo(p, t = today()) {
    const every = waterEvery(p);
    const w = lastLog(p.id, 'water');
    const base = w ? w.date : (p.created || t);
    let due = addDays(base, every);
    const c = lastLog(p.id, 'check');
    if (c && (!w || c.date >= w.date)) { const re = addDays(c.date, Number(S.settings.recheck) || 2); if (re > due) due = re; }
    return { every, last: w && w.date, due, left: diffDays(t, due), snoozed: !!(c && (!w || c.date >= w.date)) };
  }
  function fertInfo(p, t = today()) {
    const n = Number(p.fertEvery) || 0;
    if (!n) return null;
    const f = lastLog(p.id, 'fertilize');
    const due = addDays(f ? f.date : (p.created || t), n);
    const paused = S.settings.fertGrowOnly && !GROW.includes(curMonth());
    return { every: n, last: f && f.date, due, left: diffDays(t, due), paused };
  }
  function dueLabel(left) {
    if (left < 0) return { cls: 'late', txt: -left + '일 지남' };
    if (left === 0) return { cls: 'today', txt: '오늘' };
    if (left === 1) return { cls: 'soon', txt: '내일' };
    if (left <= 3) return { cls: 'soon', txt: left + '일 뒤' };
    return { cls: 'later', txt: left + '일 뒤' };
  }
  const pill = left => { const d = dueLabel(left); return '<span class="due ' + d.cls + '">' + d.txt + '</span>'; };
  const active = () => S.plants.filter(p => !p.archived);
  const waterDue = () => active().map(p => ({ p, w: waterInfo(p) })).filter(x => x.w.left <= 0).sort((a, b) => a.w.left - b.w.left);
  const fertDue = () => active().map(p => ({ p, f: fertInfo(p) })).filter(x => x.f && !x.f.paused && x.f.left <= 0);
  const dueCount = () => waterDue().length + fertDue().length;
  // 오늘 끝낸 돌봄 (물·비료·흙 확인)
  const doneToday = () => S.logs.filter(l => l.date === today() && ['water', 'fertilize', 'check'].includes(l.type) && plantById(l.plantId)).sort((a, b) => a.at - b.at);
  // 최근 7일 일별 개수 (새잎은 장 수)
  function series(fn) {
    const t = today();
    return [6, 5, 4, 3, 2, 1, 0].map(n => { const d = addDays(t, -n); return S.logs.filter(l => l.date === d && fn(l)).reduce((s, l) => s + (l.type === 'newleaf' ? (l.count || 1) : 1), 0); });
  }
  function spark(vals) {
    const max = Math.max(1, ...vals);
    const pts = vals.map((v, i) => (i * 64 / 6).toFixed(1) + ',' + (23 - v / max * 20).toFixed(1)).join(' ');
    return '<svg class="spark" viewBox="0 0 64 26" aria-hidden="true"><polyline points="' + pts + '"/></svg>';
  }

  function updateBadge() {
    try {
      const n = dueCount();
      if ('setAppBadge' in navigator) n ? navigator.setAppBadge(n).catch(() => {}) : navigator.clearAppBadge().catch(() => {});
    } catch (e) {}
  }

  /* ───────── 기록 추가·삭제 ───────── */
  function addLog(plantId, type, extra = {}) {
    const l = Object.assign({ id: nid('l'), plantId, type, date: today(), note: '', at: Date.now() }, extra);
    S.logs.push(l);
    return l;
  }
  function removeLogs(ids) {
    const set = new Set(ids);
    const pics = S.logs.filter(l => set.has(l.id) && l.photo).map(l => l.photo);
    S.logs = S.logs.filter(l => !set.has(l.id));
    pics.forEach(dropPhotoIfUnused);
  }
  // 어떤 식물·기록도 쓰지 않는 사진만 지움 (대표 사진과 성장 기록이 같은 사진을 공유)
  function dropPhotoIfUnused(id) {
    if (!id) return;
    if (S.plants.some(p => p.photo === id) || S.logs.some(l => l.photo === id)) return;
    photoDel(id);
  }

  /* ───────── 유틸 ───────── */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel, r = document) => r.querySelector(sel);
  const won = n => Number(n).toLocaleString('ko-KR') + '원';
  function thumb(p, cls = '') {
    return '<div class="thumb ' + cls + '">' + (p.photo ? '<img alt="" data-ph="' + esc(p.photo) + '">' : ico('plant')) + '</div>';
  }
  let toastTimer = null;
  function toast(msg, undo) {
    const t = $('#toast');
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" id="toastUndo">되돌리기</button>' : '');
    t.classList.add('show');
    if (undo) $('#toastUndo').onclick = () => { undo(); t.classList.remove('show'); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2500);
  }
  function applyTheme() {
    const th = S.settings.theme;
    if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
    else delete document.documentElement.dataset.theme;
  }
  function season() {
    const m = curMonth();
    return WINTER.includes(m) ? 'winter' : m <= 5 ? 'spring' : m <= 8 ? 'summer' : 'fall';
  }

  /* ───────── 화면 ───────── */
  function render() {
    applyTheme();
    const app = $('#app');
    let html;
    if (ui.edit) html = editView();
    else if (ui.plant && plantById(ui.plant)) html = plantView(plantById(ui.plant));
    else { ui.plant = null; html = ({ today: todayView, plants: plantsView, logs: logsView, settings: settingsView }[ui.tab] || todayView)(); }
    app.innerHTML = html;
    renderTabs();
    fillPhotos(app);
    if (ui.edit) restoreDraft();
  }
  function renderTabs() {
    const n = dueCount();
    const tabs = [['today', 'sun', '오늘'], ['plants', 'plant', '식물'], ['logs', 'book', '기록'], ['settings', 'sliders', '설정']];
    $('#tabs').innerHTML = tabs.map(([id, ic, label]) =>
      '<button type="button" data-act="tab" data-id="' + id + '" class="' + (ui.tab === id && !ui.edit && !ui.plant ? 'on' : '') + '"' + (ui.tab === id ? ' aria-current="page"' : '') + '>' +
      ico(ic) + label + (id === 'today' && n ? '<i class="badge">' + n + '</i>' : '') + '</button>').join('');
    $('.plus').innerHTML = ico('plus');
  }
  // 머리줄: 제목 + 오른쪽 둥근 버튼
  function header(title, sub, opt = {}) {
    return '<header class="top">' +
      (opt.back ? '<button type="button" class="round" data-act="back" aria-label="뒤로">' + ico('back') + '</button>' : '') +
      '<h1>' + esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</h1>' + (opt.right || '') + '</header>';
  }

  /* 오늘 */
  function todayView() {
    const t = today();
    const plants = active();
    const n = dueCount();
    const right = '<button type="button" class="round" data-act="tab" data-id="logs" aria-label="기록 보기">' + ico('calendar') + (n ? '<span class="dot">' + n + '</span>' : '') + '</button>';
    let h = header('병아리 정원', fmtDate(t), { right });
    const hr = new Date().getHours();
    const hello = hr < 5 ? '늦은 밤이에요' : hr < 11 ? '좋은 아침이에요' : hr < 17 ? '좋은 오후예요' : '좋은 저녁이에요';

    if (!plants.length) {
      h += '<section class="deep hero"><div class="txt"><h2>' + hello + ', 식집사님!</h2><p>첫 식물을 등록하면 물 줄 날을 챙겨 드릴게요.</p>' +
        '<button type="button" class="cta" data-act="new">' + ico('plus') + '첫 식물 등록</button></div><div class="art">' + ART_PLANT + '</div></section>';
      h += '<div class="card"><div class="empty"><div class="art">' + ART_CHICK + '</div><b>아직 정원이 비어 있어요</b><p class="small">어떻게 쓰는지 먼저 보고 싶다면 예시 식물로 둘러보세요.</p>' +
        '<button type="button" class="btn" data-act="sample">예시로 둘러보기</button></div></div>';
      return h + tipCard();
    }
    const wd = waterDue(), fd = fertDue(), done = doneToday();
    const soon7 = plants.filter(p => { const l = waterInfo(p).left; return l > 0 && l <= 7; }).length;
    h += '<section class="deep hero"><div class="txt"><h2>' + hello + ', 식집사님!</h2><p>' +
      (n ? '오늘 돌볼 식물이 <b>' + n + '건</b>' + (soon7 ? ', 이번 주에 <b>' + soon7 + '건</b> 더 있어요.' : ' 있어요.') : '오늘은 쉬어도 돼요.' + (soon7 ? ' 이번 주에 <b>' + soon7 + '건</b>이 기다려요.' : '')) + '</p>' +
      '<button type="button" class="cta" data-act="new">' + ico('plus') + '식물 등록</button></div><div class="art">' + ART_PLANT + '</div></section>';

    if (S.sample) h += '<div class="note warn"><span class="grow">예시 식물을 보고 있어요.</span><button type="button" class="btn sm" data-act="clearSample">지우고 시작</button></div>';
    else if (needBackup()) h += '<div class="note warn"><span class="grow">' + (S.lastBackup ? '마지막 백업이 ' + diffDays(S.lastBackup.slice(0, 10), t) + '일 전이에요.' : '아직 백업한 적이 없어요.') + ' 브라우저 데이터를 지우면 기록이 사라져요.</span><button type="button" class="btn sm" data-act="export">백업</button></div>';
    if (isWinter()) h += '<div class="note"><span class="tile sm">' + ico('snow') + '</span><span class="grow">겨울철이라 물주기 간격을 ' + S.settings.winterFactor + '배로 늘려 계산하고 있어요.</span></div>';

    // 통계 카드
    const leaf30 = S.logs.filter(l => l.type === 'newleaf' && diffDays(l.date, t) <= 30).reduce((s, l) => s + (l.count || 1), 0);
    const water7 = series(l => l.type === 'water');
    const stat = (ic, label, val, unit, sub, sp, act) => '<button type="button" class="deep stat" data-act="tab" data-id="' + act + '"><div class="top"><span class="tile">' + ico(ic) + '</span>' + spark(sp) + '</div>' +
      '<div class="lb">' + label + '</div><div class="val">' + val + '<small>' + unit + '</small></div><div class="sub">' + sub + '</div></button>';
    h += '<div class="stats">' +
      stat('plant', '내 식물', plants.length, '개', '보관 ' + (S.plants.length - plants.length) + '개', series(l => l.type === 'photo' || l.type === 'repot'), 'plants') +
      stat('check', '오늘 할 일', n, '건', '완료 <b>' + done.length + '</b>건', series(l => ['water', 'fertilize', 'check'].includes(l.type)), 'today') +
      stat('drop', '이번 주 물주기', water7.reduce((a, b) => a + b, 0), '번', '최근 7일', water7, 'logs') +
      stat('leaf', '새잎', leaf30, '장', '최근 30일', series(l => l.type === 'newleaf'), 'logs') + '</div>';

    // 오늘 할 일
    const total = wd.length + fd.length + done.length;
    h += '<section class="card"><div class="card-h"><h2>오늘 할 일<small>' + total + '개 중 ' + done.length + '개 완료</small></h2>' +
      (wd.length > 1 ? '<button type="button" class="pill-btn" data-act="waterAll">모두 물 줬어요</button>' : '') + '</div>' +
      '<div class="progress"><i style="width:' + (total ? Math.round(done.length / total * 100) : 0) + '%"></i></div>';
    if (!total) h += '<p class="small muted" style="margin:10px 0 0">오늘은 돌볼 식물이 없어요.</p>';
    h += wd.map(({ p, w }) => {
      const ask = p.checkMode ? '흙이 말랐는지 확인' : (w.snoozed ? '다시 확인할 날' : w.every + '일마다');
      return '<div class="task"><button type="button" class="chk" data-act="water" data-id="' + p.id + '" aria-label="' + esc(p.name) + ' 물 줬어요">' + ico('check') + '</button>' +
        '<span class="tile sm">' + ico(p.checkMode ? 'eye' : 'drop') + '</span>' +
        '<div class="body" data-act="open" data-id="' + p.id + '"><div class="title">' + esc(p.name) + ' 물주기</div><div class="meta">' + esc([p.location, ask].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div class="side">' + pill(w.left) + '<button type="button" class="linkbtn" data-act="snooze" data-id="' + p.id + '">아직 촉촉해요</button></div></div>';
    }).join('');
    h += fd.map(({ p, f }) =>
      '<div class="task"><button type="button" class="chk" data-act="fert" data-id="' + p.id + '" aria-label="' + esc(p.name) + ' 비료 줬어요">' + ico('check') + '</button>' +
      '<span class="tile sm">' + ico('flask') + '</span>' +
      '<div class="body" data-act="open" data-id="' + p.id + '"><div class="title">' + esc(p.name) + ' 비료</div><div class="meta">' + f.every + '일마다 · 마지막 ' + (f.last ? fmtShort(f.last) : '기록 없음') + '</div></div>' +
      '<div class="side">' + pill(f.left) + '<button type="button" class="linkbtn" data-act="fertSkip" data-id="' + p.id + '">건너뛰기</button></div></div>').join('');
    h += done.map(l => {
      const p = plantById(l.plantId), tp = LOG_TYPES[l.type];
      return '<div class="task done"><button type="button" class="chk on" data-act="undoDone" data-id="' + l.id + '" aria-label="완료 취소">' + ico('check') + '</button>' +
        '<span class="tile sm">' + ico(tp.ic) + '</span>' +
        '<div class="body" data-act="open" data-id="' + p.id + '"><div class="title">' + esc(p.name) + ' ' + tp.label + '</div><div class="meta">' + (l.type === 'check' ? S.settings.recheck + '일 뒤 다시 확인' : l.skipped ? '이번엔 건너뜀' : '완료') + '</div></div></div>';
    }).join('');
    h += '</section>';

    // 다가오는 7일
    const soon = plants.map(p => ({ p, w: waterInfo(p) })).filter(x => x.w.left > 0 && x.w.left <= 7).sort((a, b) => a.w.left - b.w.left);
    h += '<section class="card flush"><div class="card-h"><h2>다가오는 7일<small>물주기 예정</small></h2><button type="button" class="pill-btn" data-act="tab" data-id="plants">전체 보기</button></div>';
    h += soon.length ? '<div class="rows">' + soon.map(({ p, w }) =>
      '<button type="button" class="row" data-act="open" data-id="' + p.id + '">' + thumb(p) +
      '<div class="body"><div class="title">' + esc(p.name) + '</div><div class="meta">' + fmtDate(w.due) + (p.checkMode ? ' · 흙 확인' : '') + '</div></div>' + pill(w.left) + '</button>').join('') + '</div>'
      : '<p class="small muted" style="padding:0 18px 12px;margin:0">일주일 안에 물 줄 식물이 없어요.</p>';
    h += '</section>';

    const recent = S.logs.filter(l => ['newleaf', 'flower'].includes(l.type) && diffDays(l.date, t) <= 30).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
    if (recent.length) h += '<section class="card"><div class="card-h"><h2>최근 좋은 소식<small>새잎·꽃 (30일)</small></h2></div><div class="tl">' + recent.map(l => logItem(l)).join('') + '</div></section>';
    return h + tipCard();
  }
  function tipCard() {
    const list = TIPS[season()].concat(TIPS.any);
    const i = (diffDays('2026-01-01', today()) + ui.tip) % list.length;
    return '<section class="deep tip"><div class="art">' + ART_CHICK + '</div><div><h3>오늘의 식집사 팁</h3><p>' + esc(list[(i + list.length) % list.length]) + '</p>' +
      '<button type="button" class="cta" data-act="nextTip">' + ico('sparkle') + '다른 팁</button></div></section>';
  }
  function needBackup() {
    if (!S.logs.length && S.plants.length < 2) return false;
    return !S.lastBackup || diffDays(S.lastBackup.slice(0, 10), today()) >= 30;
  }

  /* 식물 목록 */
  function plantsView() {
    const right = '<button type="button" class="round" data-act="new" aria-label="식물 등록">' + ico('plus') + '</button>';
    let h = header('내 식물', active().length + '개 키우는 중', { right });
    const list = active().map(p => ({ p, w: waterInfo(p) }));
    if (!S.plants.length) return h + '<div class="card"><div class="empty"><div class="art">' + ART_CHICK + '</div><b>등록된 식물이 없어요</b><p class="small">오른쪽 위 + 버튼으로 등록해 보세요.</p><button type="button" class="btn" data-act="sample">예시로 둘러보기</button></div></div>';
    h += '<label class="search">' + ico('search') + '<input type="text" id="q" placeholder="이름·품종·자리 검색" value="' + esc(ui.q) + '" aria-label="식물 검색"></label>';
    const q = ui.q.trim().toLowerCase();
    const hit = x => !q || [x.p.name, x.p.species, x.p.location].some(v => (v || '').toLowerCase().includes(q));
    const groups = {};
    list.filter(hit).forEach(x => { const k = x.p.location || '자리 미정'; (groups[k] = groups[k] || []).push(x); });
    const keys = Object.keys(groups).sort((a, b) => a === '자리 미정' ? 1 : b === '자리 미정' ? -1 : a.localeCompare(b, 'ko'));
    if (!keys.length && list.length) h += '<p class="small muted">"' + esc(ui.q) + '"에 맞는 식물이 없어요.</p>';
    keys.forEach(k => {
      const g = groups[k].sort((a, b) => a.w.left - b.w.left);
      h += '<section class="card flush"><div class="card-h"><h2>' + esc(k) + '<small>' + g.length + '개</small></h2></div><div class="rows">' + g.map(({ p, w }) =>
        '<button type="button" class="row" data-act="open" data-id="' + p.id + '">' + thumb(p) +
        '<div class="body"><div class="title">' + esc(p.name) + '</div><div class="meta">' + esc([p.species, p.light].filter(Boolean).join(' · ') || '정보 없음') + '</div></div>' +
        pill(w.left) + '</button>').join('') + '</div></section>';
    });
    const arch = S.plants.filter(p => p.archived && hit({ p }));
    if (arch.length) h += '<section class="card flush"><div class="card-h"><h2>보관한 식물<small>' + arch.length + '개 · 알림 없음</small></h2></div><div class="rows">' +
      arch.map(p => '<button type="button" class="row" data-act="open" data-id="' + p.id + '">' + thumb(p) + '<div class="body"><div class="title muted">' + esc(p.name) + '</div><div class="meta">' + esc(p.archivedNote || '보관함') + '</div></div></button>').join('') + '</div></section>';
    return h;
  }

  /* 식물 상세 */
  function plantView(p) {
    const t = today();
    const w = waterInfo(p), f = fertInfo(p);
    const right = '<button type="button" class="round" data-act="edit" data-id="' + p.id + '" aria-label="정보 수정">' + ico('pen') + '</button>';
    let h = header(p.name, p.species, { back: true, right });
    h += thumb(p, 'lg');
    const days = diffDays(p.acquired || p.created || t, t) + 1;
    const leaves = logsOf(p.id, 'newleaf').reduce((n, l) => n + (l.count || 1), 0);
    h += '<div class="mini"><div><b>' + Math.max(1, days) + '일</b><span>함께한 날</span></div><div><b>' + leaves + '장</b><span>새잎</span></div><div><b>' + logsOf(p.id).length + '건</b><span>기록</span></div></div>';

    if (p.archived) h += '<div class="note warn"><span class="grow">보관한 식물이에요. 알림에서 빠집니다.</span><button type="button" class="btn sm" data-act="unarchive" data-id="' + p.id + '">다시 키우기</button></div>';
    else {
      const r = lastLog(p.id, 'repot');
      h += '<section class="card"><div class="card-h"><h2>돌봄 일정</h2></div>' +
        '<div class="sched"><span class="tile">' + ico(p.checkMode ? 'eye' : 'drop') + '</span><div class="body"><div class="t">' + (p.checkMode ? '흙 확인' : '물주기') + ' ' + pill(w.left) + '<span class="small muted">' + fmtShort(w.due) + '</span></div>' +
        '<div class="m">' + w.every + '일마다' + (isWinter() ? ' (겨울 조정)' : '') + ' · 마지막 ' + (w.last ? fmtDate(w.last) : '기록 없음') + '</div></div>' +
        '<button type="button" class="btn sm primary" data-act="water" data-id="' + p.id + '">물 줬어요</button></div>' +
        (f ? '<div class="sched"><span class="tile">' + ico('flask') + '</span><div class="body"><div class="t">비료 ' + (f.paused ? '<span class="due later">생장기에 알림</span>' : pill(f.left) + '<span class="small muted">' + fmtShort(f.due) + '</span>') + '</div>' +
          '<div class="m">' + f.every + '일마다 · 마지막 ' + (f.last ? fmtDate(f.last) : '기록 없음') + '</div></div></div>' : '') +
        '<div class="sched"><span class="tile">' + ico('pot') + '</span><div class="body"><div class="t">분갈이</div><div class="m">' + (r ? fmtDate(r.date) + ' · ' + Math.floor(diffDays(r.date, t) / 30) + '개월 전' : '기록 없음') + '</div></div></div>' +
        '</section>';
    }

    h += '<section class="card"><div class="card-h"><h2>기록하기</h2></div><div class="acts">' + QUICK.map(k => '<button type="button" data-act="log" data-type="' + k + '" data-id="' + p.id + '"><span class="tile">' + ico(LOG_TYPES[k].ic) + '</span>' + LOG_TYPES[k].label + '</button>').join('') + '</div></section>';

    const pics = logsOf(p.id).filter(l => l.photo).sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
    if (pics.length) h += '<section class="card"><div class="card-h"><h2>성장 사진<small>' + pics.length + '장 · 오래된 순</small></h2></div><div class="strip">' + pics.map(l => '<figure><img alt="' + esc(fmtDate(l.date)) + ' 사진" data-ph="' + esc(l.photo) + '" data-act="view" data-ph-id="' + esc(l.photo) + '" data-cap="' + esc(fmtDate(l.date) + ' · ' + LOG_TYPES[l.type].label) + '"><figcaption>' + fmtShort(l.date) + ' · ' + esc(LOG_TYPES[l.type].label) + '</figcaption></figure>').join('') + '</div></section>';

    const info = [['위치', p.location], ['햇빛', p.light], ['화분', [p.potMaterial, p.potSize].filter(Boolean).join(' · ')], ['흙', p.soil], ['들인 날', p.acquired && fmtDate(p.acquired)], ['구입처', p.source], ['가격', p.price ? won(p.price) : '']].filter(x => x[1]);
    h += '<section class="card"><div class="card-h"><h2>정보</h2><button type="button" class="pill-btn" data-act="edit" data-id="' + p.id + '">수정</button></div>' +
      (info.length ? '<dl class="info">' + info.map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>' : '<p class="muted small" style="margin:0">등록된 정보가 없어요.</p>') +
      (p.memo ? '<p class="small" style="margin:12px 0 0;white-space:pre-wrap">' + esc(p.memo) + '</p>' : '') + '</section>';

    const logs = logsOf(p.id).sort((a, b) => b.date.localeCompare(a.date) || b.at - a.at);
    h += '<section class="card"><div class="card-h"><h2>관리 일지<small>' + logs.length + '건</small></h2></div>' +
      (logs.length ? '<div class="tl">' + logs.map(l => logItem(l, true)).join('') + '</div>' : '<p class="muted small" style="margin:0">아직 기록이 없어요.</p>') + '</section>';

    h += '<div class="btns">' +
      (p.archived ? '' : '<button type="button" class="btn" data-act="archive" data-id="' + p.id + '">' + ico('box') + '보관하기</button>') +
      '<button type="button" class="btn danger" data-act="delPlant" data-id="' + p.id + '">' + ico('trash') + '삭제</button></div>' +
      '<p class="hint">보관: 떠나보낸 식물이나 나눔한 식물을 기록은 남긴 채 알림에서 뺍니다.</p>';
    return h;
  }
  function logItem(l, hidePlant, hideDate) {
    const tp = LOG_TYPES[l.type] || LOG_TYPES.note;
    const p = plantById(l.plantId);
    return '<div class="item"><span class="tile sm">' + ico(tp.ic) + '</span><div class="body">' +
      '<div class="t">' + (hidePlant || !p ? '' : '<a href="#" data-act="open" data-id="' + esc(l.plantId) + '">' + esc(p.name) + '</a> · ') + tp.label + (l.count ? ' ' + l.count + '장' : '') + '</div>' +
      (hideDate ? '' : '<div class="d">' + fmtDate(l.date) + '</div>') +
      (l.note ? '<p>' + esc(l.note) + '</p>' : '') +

  /* 기록 */
  function logsView() {
    const right = '<button type="button" class="round" data-act="logPick" aria-label="기록 추가"' + (active().length ? '' : ' disabled') + '>' + ico('plus') + '</button>';
    let h = header('기록', '모두 ' + S.logs.length + '건', { right });
    h += '<div class="filters"><select id="logType" aria-label="종류"><option value="">모든 종류</option>' + Object.keys(LOG_TYPES).map(k => '<option value="' + k + '"' + (ui.logType === k ? ' selected' : '') + '>' + LOG_TYPES[k].label + '</option>').join('') + '</select>' +
      '<select id="logPlant" aria-label="식물"><option value="">모든 식물</option>' + S.plants.map(p => '<option value="' + p.id + '"' + (ui.logPlant === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>';
    const list = S.logs.filter(l => (!ui.logType || l.type === ui.logType) && (!ui.logPlant || l.plantId === ui.logPlant)).sort((a, b) => b.date.localeCompare(a.date) || b.at - a.at);
    if (!list.length) return h + '<div class="card"><div class="empty"><div class="art">' + ART_CHICK + '</div><b>' + (S.logs.length ? '조건에 맞는 기록이 없어요' : '아직 기록이 없어요') + '</b><p class="small">물을 주거나 새잎이 나면 기록해 보세요.</p></div></div>';
    let cur = '', out = '';
    list.slice(0, 300).forEach(l => {
      if (l.date !== cur) { if (cur) out += '</div></section>'; cur = l.date; out += '<div class="day">' + fmtDate(l.date) + '</div><section class="card" style="padding:4px 18px"><div class="tl">'; }
      out += logItem(l, false, true);
    });
    out += '</div></section>';
    if (list.length > 300) out += '<p class="hint">최근 300건만 보여요. 종류나 식물로 좁혀 보세요.</p>';

  }

  /* 설정 */
  function settingsView() {
    const st = S.settings;
    let h = header('설정', '백업과 계산 방식');
    h += '<section class="deep hero" style="min-height:0"><div class="txt"><h2>내 정원은 이 휴대폰에만</h2><p>모든 기록과 사진은 이 브라우저 안에만 저장돼요. 서버로 보내지 않아요. 휴대폰을 바꾸기 전에 백업 파일을 만들어 두세요.</p>' +
      '<p class="small" style="margin:0">마지막 백업 <b>' + (S.lastBackup ? fmtDate(S.lastBackup.slice(0, 10)) : '없음') + '</b> · <span id="usage">용량 계산 중…</span></p></div></section>';
    h += '<div class="btns" style="margin-bottom:14px"><button type="button" class="btn primary" data-act="export">' + ico('down') + '백업 파일 만들기</button><button type="button" class="btn" data-act="import">' + ico('up') + '백업 불러오기</button></div>';
    h += '<section class="card"><div class="card-h"><h2>물주기 계산</h2></div><form id="setForm">' +
      '<div class="f"><label class="check"><input type="checkbox" name="winter"' + (st.winter ? ' checked' : '') + '><span><b>겨울(12~2월)에는 간격 늘리기</b><br><span class="hint">추우면 흙이 천천히 말라요.</span></span></label></div>' +
      '<div class="two"><div class="f"><label for="sFactor">겨울 배수</label><select id="sFactor" name="winterFactor">' + [1.25, 1.5, 2].map(v => '<option value="' + v + '"' + (Number(st.winterFactor) === v ? ' selected' : '') + '>' + v + '배</option>').join('') + '</select></div>' +
      '<div class="f"><label for="sRecheck">"아직 촉촉해요" 후</label><select id="sRecheck" name="recheck">' + [1, 2, 3, 5].map(v => '<option value="' + v + '"' + (Number(st.recheck) === v ? ' selected' : '') + '>' + v + '일 뒤 다시</option>').join('') + '</select></div></div>' +
      '<div class="f" style="margin:0"><label class="check"><input type="checkbox" name="fertGrowOnly"' + (st.fertGrowOnly ? ' checked' : '') + '><span><b>비료 알림은 생장기(3~10월)에만</b></span></label></div>' +
      '</form></section>';
    h += '<section class="card"><div class="card-h"><h2>화면</h2></div><div class="chips" role="group" aria-label="테마">' + [['auto', '기기 설정 따르기'], ['light', '밝게'], ['dark', '어둡게']].map(([v, l]) => '<button type="button" class="chip' + (st.theme === v ? ' on' : '') + '" data-act="theme" data-v="' + v + '">' + l + '</button>').join('') + '</div></section>';
    h += '<section class="card"><div class="card-h"><h2>앱으로 설치</h2></div><p class="small muted" style="margin:0">크롬 메뉴(⋮) → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르면 아이콘으로 바로 열 수 있고 인터넷 없이도 쓸 수 있어요. 아이폰은 사파리 공유 버튼 → 홈 화면에 추가.<br>알림은 앱을 열었을 때 "오늘" 화면과 아이콘 숫자 배지로 보여 드려요.</p></section>';
    h += '<section class="card"><div class="card-h"><h2>데이터</h2></div><div class="btns">' + (S.plants.length ? '' : '<button type="button" class="btn" data-act="sample">예시 식물 넣기</button>') +
      '<button type="button" class="btn danger" data-act="reset">' + ico('trash') + '모든 데이터 지우기</button></div></section>';
    h += '<p class="hint" style="text-align:center">병아리 정원 · 데이터 버전 ' + S.v + '</p>';
    setTimeout(showUsage, 0);
    return h;
  }
  async function showUsage() {
    const el = $('#usage'); if (!el) return;
    try {
      const e = await navigator.storage.estimate();
      el.textContent = '사용 중 ' + (e.usage / 1048576).toFixed(1) + 'MB';
    } catch (e) { el.textContent = '식물 ' + S.plants.length + '개 · 기록 ' + S.logs.length + '건'; }
  }

  /* ───────── 기록 시트 ───────── */
  let sheet = null;   // { plantId, type, date, note, count, photo }
  function openLogSheet(plantId, type) {
    sheet = { plantId: plantId || (active()[0] || {}).id, type: type || 'water', date: today(), note: '', count: '', photo: null };
    renderSheet();
    if (type === 'photo') setTimeout(() => pickPhoto('log'), 50);
  }
  function renderSheet() {
    if (!sheet) { $('#layer').innerHTML = ''; return; }
    const tp = LOG_TYPES[sheet.type];
    $('#layer').innerHTML = '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">' +
      '<h3 id="shTitle"><span class="tile sm">' + ico(tp.ic) + '</span><span class="grow">' + tp.label + ' 기록</span><button type="button" class="x" data-act="closeSheet" aria-label="닫기">' + ico('x') + '</button></h3>' +
      '<form id="logForm">' +
      '<div class="f"><label for="lPlant">식물</label><select id="lPlant" name="plantId">' + active().map(p => '<option value="' + p.id + '"' + (p.id === sheet.plantId ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></div>' +
      '<div class="f"><label for="lType">종류</label><select id="lType" name="type">' + Object.keys(LOG_TYPES).map(k => '<option value="' + k + '"' + (k === sheet.type ? ' selected' : '') + '>' + LOG_TYPES[k].label + '</option>').join('') + '</select></div>' +
      '<div class="two"><div class="f"><label for="lDate">날짜</label><input type="date" id="lDate" name="date" max="' + today() + '" value="' + sheet.date + '"></div>' +
      (sheet.type === 'newleaf' ? '<div class="f"><label for="lCount">몇 장?</label><input type="number" id="lCount" name="count" min="1" max="99" inputmode="numeric" value="' + esc(sheet.count) + '" placeholder="1"></div>' : '<div></div>') + '</div>' +
      '<div class="f"><label for="lNote">메모</label><textarea id="lNote" name="note" maxlength="1000" placeholder="' + esc(notePh(sheet.type)) + '">' + esc(sheet.note) + '</textarea></div>' +
      '<div class="f"><label>사진</label><div class="photo-pick"><div class="thumb">' + (sheet.photo ? '<img alt="" src="' + sheet.photo + '">' : ico('camera')) + '</div>' +
      '<div class="btns"><button type="button" class="btn sm" data-act="pickPhoto" data-for="log">' + (sheet.photo ? '바꾸기' : '사진 추가') + '</button>' + (sheet.photo ? '<button type="button" class="btn sm" data-act="dropLogPhoto">빼기</button>' : '') + '</div></div></div>' +
      '<button type="submit" class="btn primary block">기록하기</button></form></div></div>';
  }
  function notePh(type) {
    return ({ water: '예: 저면관수 20분', fertilize: '예: 하이포넥스 1000배', repot: '예: 15cm → 18cm, 뿌리 정리', pest: '예: 잎 뒷면 응애, 물샤워 후 약 뿌림', move: '예: 베란다 → 거실 창가', newleaf: '예: 찢잎 나옴!', check: '예: 겉흙 2cm 아직 촉촉' }[type]) || '';
  }
  function syncSheet() {
    const f = $('#logForm'); if (!f || !sheet) return;
    sheet.plantId = f.plantId.value; sheet.date = f.date.value || today(); sheet.note = f.note.value;
    if (f.count) sheet.count = f.count.value;
  }
  // + 버튼: 무엇을 추가할지 고르기
  function openChooser() {
    if (!active().length) { draft = null; pushNav({ edit: 'new' }); return; }
    sheet = null;
    $('#layer').innerHTML = '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="추가하기">' +
      '<h3><span class="grow">무엇을 추가할까요?</span><button type="button" class="x" data-act="closeSheet" aria-label="닫기">' + ico('x') + '</button></h3><div class="choose">' +
      '<button type="button" data-act="chooseLog"><span class="tile">' + ico('note') + '</span>돌봄 기록<span>물주기, 새잎, 분갈이…</span></button>' +
      '<button type="button" data-act="chooseNew"><span class="tile">' + ico('plant') + '</span>새 식물<span>정원에 식구 들이기</span></button>' +
      '</div></div></div>';
  }

  /* ───────── 사진 고르기 ───────── */
  let pickFor = null;
  function pickPhoto(target) { pickFor = target; const i = $('#filePhoto'); i.value = ''; i.click(); }
  $('#filePhoto').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = await compress(file);
      if (pickFor === 'plant' && draft) { syncDraft(); draft.newPhoto = data; render(); }
      else if (pickFor === 'log' && sheet) { syncSheet(); sheet.photo = data; renderSheet(); }
    } catch (err) { toast(err.message); }
  });

  function syncDraft() {
    const f = $('#plantForm'); if (!f || !draft) return;
    draft.values = Object.fromEntries(new FormData(f));
    draft.values.checkMode = f.checkMode.checked;
    draft.every = f.waterEvery.value;
  }
  // 다시 그린 폼에 입력하던 값 되살리기
  function restoreDraft() {
    const f = $('#plantForm'); if (!f || !draft || !draft.values) return;
    for (const [k, v] of Object.entries(draft.values)) {
      if (!f[k]) continue;
      if (f[k].type === 'checkbox') f[k].checked = !!v; else f[k].value = v;
    }
  }

  /* ───────── 동작 ───────── */
  function go(patch) {
    Object.assign(ui, patch);
    render();
    window.scrollTo(0, 0);
  }
  const navStack = [];
  function pushNav(patch) {
    navStack.push({ tab: ui.tab, plant: ui.plant, edit: ui.edit });
    history.pushState({ cg: navStack.length }, '');
    go(patch);
  }
  function back() {
    if (navStack.length) history.back();
    else { draft = null; go({ edit: null, plant: null }); }
  }
  const closeLayer = () => { sheet = null; $('#layer').innerHTML = ''; };
  window.addEventListener('popstate', () => {
    if ($('#layer').innerHTML) { closeLayer(); history.pushState({ cg: navStack.length }, ''); return; }
    const prev = navStack.pop();
    draft = null;
    go(prev || { edit: null, plant: null });
  });

  function water(ids) {
    const added = ids.map(id => addLog(id, 'water'));
    save(); render();
    const names = ids.map(id => plantById(id).name);
    toast((names.length > 1 ? names.length + '개 식물' : names[0]) + '에 물 준 걸 기록했어요', () => { removeLogs(added.map(l => l.id)); save(); render(); });
  }

  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === 'closeSheet') { if (e.target === el || el.classList.contains('x')) closeLayer(); return; }
    if (el.tagName === 'A') e.preventDefault();
    switch (act) {
      case 'tab':
        navStack.length = 0; draft = null; closeLayer();
        go({ tab: id, plant: null, edit: null }); break;
      case 'back': back(); break;
      case 'open': closeLayer(); pushNav({ plant: id, edit: null }); break;
      case 'new': draft = null; pushNav({ edit: 'new' }); break;
      case 'edit': draft = null; pushNav({ edit: id }); break;
      case 'quick': openChooser(); break;
      case 'chooseLog': closeLayer(); openLogSheet(ui.plant || null, 'water'); break;
      case 'chooseNew': closeLayer(); draft = null; pushNav({ edit: 'new' }); break;
      case 'nextTip': ui.tip++; render(); break;
      case 'every': syncDraft(); draft.every = el.dataset.n; draft.values.waterEvery = el.dataset.n; render(); break;
      case 'pickPhoto': pickPhoto(el.dataset.for); break;
      case 'dropPhoto': syncDraft(); draft.newPhoto = null; draft.photo = null; render(); break;
      case 'dropLogPhoto': syncSheet(); sheet.photo = null; renderSheet(); break;
      case 'water': water([id]); break;
      case 'waterAll': water(waterDue().map(x => x.p.id)); break;
      case 'snooze': {
        const l = addLog(id, 'check', { note: '아직 촉촉해서 미룸' }); save(); render();
        toast(S.settings.recheck + '일 뒤에 다시 알려 드릴게요', () => { removeLogs([l.id]); save(); render(); }); break;
      }
      case 'fert': {
        const l = addLog(id, 'fertilize'); save(); render();
        toast('비료 준 걸 기록했어요', () => { removeLogs([l.id]); save(); render(); }); break;
      }
      case 'fertSkip': {
        const l = addLog(id, 'fertilize', { note: '건너뜀', skipped: true }); save(); render();
        toast('이번 비료는 건너뛰었어요', () => { removeLogs([l.id]); save(); render(); }); break;
      }
      case 'undoDone': {
        const l = S.logs.find(x => x.id === id); if (!l) break;
        removeLogs([id]); save(); render();
        toast('완료를 취소했어요', () => { S.logs.push(l); save(); render(); }); break;
      }
      case 'log': openLogSheet(id, el.dataset.type); break;
      case 'logPick': openLogSheet(ui.logPlant || null, ui.logType || 'water'); break;
      case 'delLog': {
        const l = S.logs.find(x => x.id === id); if (!l) break;
        S.logs = S.logs.filter(x => x.id !== id); save(); render();
        toast('기록을 지웠어요', () => { S.logs.push(l); save(); render(); });
        setTimeout(() => { if (l.photo && !S.logs.includes(l)) dropPhotoIfUnused(l.photo); }, 5500);
        break;
      }
      case 'view': {
        const src = await photoGet(el.dataset.phId); if (!src) break;
        $('#layer').innerHTML = '<div class="viewer" data-act="closeViewer" role="dialog" aria-label="사진 보기"><img alt="" src="' + src + '"><p>' + esc(el.dataset.cap || '') + '</p><p class="small">눌러서 닫기</p></div>';
        break;
      }
      case 'closeViewer': closeLayer(); break;
      case 'archive': {
        const p = plantById(id); const note = prompt('보관하는 이유를 적어 두세요 (선택)', '');
        if (note === null) break;
        p.archived = true; p.archivedNote = note || '보관함'; save(); render(); toast('보관함으로 옮겼어요'); break;
      }
      case 'unarchive': { const p = plantById(id); p.archived = false; delete p.archivedNote; save(); render(); break; }
      case 'delPlant': {
        const p = plantById(id);
        if (!confirm('"' + p.name + '"과(와) 기록 ' + logsOf(id).length + '건, 사진을 모두 지울까요? 되돌릴 수 없어요.')) break;
        S.plants = S.plants.filter(x => x.id !== id);
        removeLogs(logsOf(id).map(l => l.id));
        dropPhotoIfUnused(p.photo); save();
        navStack.length = 0; go({ plant: null, edit: null, tab: 'plants' }); toast('삭제했어요'); break;
      }
      case 'theme': S.settings.theme = el.dataset.v; save(); render(); break;
      case 'export': exportBackup(); break;
      case 'import': $('#fileBackup').value = ''; $('#fileBackup').click(); break;
      case 'sample': seed(); save(); go({ tab: 'today', plant: null, edit: null }); toast('예시 식물 4개를 넣었어요'); break;
      case 'clearSample':
        if (!confirm('예시 식물과 기록을 지우고 빈 정원으로 시작할까요?')) break;
        await wipe(); go({ tab: 'today' }); break;
      case 'reset':
        if (!confirm('모든 식물·기록·사진을 지울까요? 백업 파일이 없으면 되돌릴 수 없어요.')) break;
        await wipe(); go({ tab: 'today', plant: null, edit: null }); toast('모두 지웠어요'); break;
    }
  });

  async function wipe() {
    await photoClear();
    const theme = S.settings.theme;
    S = defaults(); S.settings.theme = theme; save();
  }

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'logType') { ui.logType = t.value; render(); }
    else if (t.id === 'logPlant') { ui.logPlant = t.value; render(); }
    else if (t.id === 'lType') { syncSheet(); sheet.type = t.value; renderSheet(); }
    else if (t.closest('#setForm')) {
      const f = $('#setForm');
      S.settings.winter = f.winter.checked;
      S.settings.winterFactor = Number(f.winterFactor.value);
      S.settings.recheck = Number(f.recheck.value);
      S.settings.fertGrowOnly = f.fertGrowOnly.checked;
      save(); toast('설정을 저장했어요');
    }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'fEvery') document.querySelectorAll('[data-act="every"]').forEach(c => c.classList.toggle('on', c.dataset.n === e.target.value));
    if (e.target.id === 'q') {
      ui.q = e.target.value; const pos = e.target.selectionStart;
      render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
    }
  });

  document.addEventListener('submit', async e => {
    e.preventDefault();
    if (e.target.id === 'plantForm') await savePlant(e.target);
    else if (e.target.id === 'logForm') await saveLog();
  });

  async function savePlant(f) {
    const v = Object.fromEntries(new FormData(f));
    const name = (v.name || '').trim();
    if (!name) { f.name.focus(); return; }
    const isNew = ui.edit === 'new';
    const p = isNew ? { id: nid('p'), created: today() } : plantById(ui.edit);
    Object.assign(p, {
      name, species: v.species.trim(), location: v.location.trim(), light: v.light,
      waterEvery: Math.min(120, Math.max(1, parseInt(v.waterEvery, 10) || 7)),
      checkMode: f.checkMode.checked,
      fertEvery: Math.min(365, Math.max(0, parseInt(v.fertEvery, 10) || 0)),
      potMaterial: v.potMaterial, potSize: v.potSize.trim(), soil: v.soil.trim(),
      acquired: isDate(v.acquired) ? v.acquired : '', price: Math.max(0, parseInt(v.price, 10) || 0) || '',
      source: v.source.trim(), memo: v.memo.trim(),
    });
    // 사진: 새로 골랐으면 저장, 뺐으면 삭제
    const oldPhoto = p.photo;
    if (draft && draft.newPhoto) {
      const pid = nid('ph'); await photoPut(pid, draft.newPhoto); p.photo = pid;
      // 대표 사진도 성장 사진 타임라인에 남김 (같은 사진을 공유)
      addLog(p.id, 'photo', { photo: pid, note: isNew ? '처음 데려온 날' : '대표 사진 변경' });
    } else if (draft && !draft.photo) p.photo = null;
    if (oldPhoto && oldPhoto !== p.photo) dropPhotoIfUnused(oldPhoto);
    if (isNew) {
      if (isDate(v.lastWater)) addLog(p.id, 'water', { date: v.lastWater, note: '등록할 때 입력' });
      S.plants.push(p);
    }
    if (S.sample && isNew) S.sample = false;
    save();
    draft = null;
    navStack.pop(); history.replaceState({ cg: navStack.length }, '');
    if (isNew) { navStack.push({ tab: ui.tab, plant: null, edit: null }); go({ edit: null, plant: p.id }); toast(name + '을(를) 정원에 들였어요'); }
    else { go({ edit: null, plant: p.id }); toast('저장했어요'); }
  }

  async function saveLog() {
    syncSheet();
    const s = sheet; if (!s || !plantById(s.plantId)) return;
    const extra = { date: isDate(s.date) && s.date <= today() ? s.date : today(), note: s.note.trim() };
    if (s.type === 'newleaf' && Number(s.count) > 0) extra.count = Math.min(99, parseInt(s.count, 10));
    if (s.photo) { const pid = nid('ph'); await photoPut(pid, s.photo); extra.photo = pid; }
    if (s.type === 'photo' && !extra.photo && !extra.note) { toast('사진이나 메모를 넣어 주세요'); return; }
    addLog(s.plantId, s.type, extra);
    closeLayer(); save(); render();
    toast(LOG_TYPES[s.type].label + ' 기록했어요');
  }

  /* ───────── 백업 ───────── */
  async function exportBackup() {
    try {
      const photos = await photoAll();
      S.lastBackup = new Date().toISOString();
      const data = { app: 'chick-garden', v: 1, exported: S.lastBackup, state: S, photos };
      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chick-garden-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      save(); render();
      toast('백업 파일을 저장했어요 (' + (blob.size / 1048576).toFixed(1) + 'MB)');
    } catch (err) { toast('백업에 실패했어요: ' + err.message); }
  }
  $('#fileBackup').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || data.app !== 'chick-garden' || !data.state || !Array.isArray(data.state.plants)) throw new Error('병아리 정원 백업 파일이 아니에요');
      const st = data.state;
      if (!confirm('백업(' + (data.exported ? fmtDate(data.exported.slice(0, 10)) : '날짜 모름') + ', 식물 ' + st.plants.length + '개 · 기록 ' + (st.logs || []).length + '건)으로 지금 데이터를 바꿀까요?')) return;
      await photoClear();
      for (const [k, v] of Object.entries(data.photos || {})) if (typeof v === 'string' && v.startsWith('data:image/')) await photoPut(k, v);
      const d = defaults();
      S = Object.assign(d, st, { settings: Object.assign(d.settings, st.settings || {}), logs: Array.isArray(st.logs) ? st.logs : [] });
      save(); navStack.length = 0; go({ tab: 'today', plant: null, edit: null });
      toast('백업을 불러왔어요');
    } catch (err) { toast('불러오기 실패: ' + err.message); }
  });

  /* ───────── 예시 데이터 ───────── */
  function seed() {
    const t = today();
    const mk = (name, species, location, light, every, extra) => {
      const p = Object.assign({ id: nid('p'), name, species, location, light, waterEvery: every, checkMode: false, fertEvery: 0, created: addDays(t, -120) }, extra);
      S.plants.push(p); return p;
    };
    const a = mk('몬순이', '몬스테라 델리시오사', '거실 창가', '밝은 간접광', 7, { fertEvery: 30, acquired: addDays(t, -400), potMaterial: '플라스틱', potSize: '지름 21cm', soil: '상토 6 : 펄라이트 4', source: '동네 화원', price: 25000, memo: '잎이 처지면 물 줄 때. 새잎은 창 쪽으로 나옴.' });
    const b = mk('스투키', '산세베리아 스투키', '침실', '반그늘', 21, { checkMode: true, acquired: addDays(t, -800), potMaterial: '세라믹' });
    const c = mk('바질', '스위트 바질', '베란다', '직광', 2, { fertEvery: 14, acquired: addDays(t, -40), source: '씨앗 파종' });
    const d = mk('필레아', '필레아 페페로미오이데스', '주방', '밝은 간접광', 5, { acquired: addDays(t, -200), source: '친구 나눔' });
    const L = (p, type, ago, extra) => addLog(p.id, type, Object.assign({ date: addDays(t, -ago) }, extra));
    L(a, 'water', 8); L(a, 'water', 15); L(a, 'fertilize', 32, { note: '하이포넥스 1000배' }); L(a, 'newleaf', 10, { count: 1, note: '찢잎 나옴!' }); L(a, 'repot', 120, { note: '18cm → 21cm' });
    L(b, 'water', 22); L(b, 'check', 1, { note: '아직 촉촉해서 미룸' });
    L(c, 'water', 1); L(c, 'water', 3); L(c, 'prune', 3, { note: '꽃대 제거' });
    L(d, 'water', 5); L(d, 'newleaf', 4, { count: 2 }); L(d, 'pest', 30, { note: '잎 뒷면 응애 → 물샤워' });
    S.sample = true;
  }

  /* ───────── 시작 ───────── */
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !ui.edit && !$('#layer').innerHTML) render(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLayer(); });

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  updateBadge();

  // 테스트용 훅
  window.__cg = { waterInfo, fertInfo, dueLabel, addDays, diffDays, get state() { return S; } };
})();
</script>
</body>
</html>
