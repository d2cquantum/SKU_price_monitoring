<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-column app shell, sticky header + tab bar, content cards in a responsive grid */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E9EEEC; --ink:#14201C; --muted:#5B6964; --line:#D9E1DE;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#D7EDE7;
  --spend:#B8432F; --income:#2263A8; --warn:#9A6A12; --ok:#2E7D4F;
  --spend-soft:#F6E2DD; --warn-soft:#F5EAD3; --ok-soft:#DDEFE3; --income-soft:#DDE8F5;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201D; --sunk:#1E2925; --ink:#E5ECE9; --muted:#97A6A0; --line:#2A3632;
  --accent:#4FC2A6; --accent-ink:#0B1311; --accent-soft:#1B3A33;
  --spend:#EE8A74; --income:#7FB2EA; --warn:#E3B45A; --ok:#71C893;
  --spend-soft:#3A2420; --warn-soft:#3A2F1A; --ok-soft:#1C3527; --income-soft:#1C2C40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201D; --sunk:#1E2925; --ink:#E5ECE9; --muted:#97A6A0; --line:#2A3632;
  --accent:#4FC2A6; --accent-ink:#0B1311; --accent-soft:#1B3A33;
  --spend:#EE8A74; --income:#7FB2EA; --warn:#E3B45A; --ok:#71C893;
  --spend-soft:#3A2420; --warn-soft:#3A2F1A; --ok-soft:#1C3527; --income-soft:#1C2C40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .row{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:13px}
.proto{font-size:11px;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px;font-weight:600}
.month{margin-left:auto;display:flex;align-items:center;gap:4px}
.month b{min-width:96px;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main.wrap{padding-block:20px 48px;display:grid;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:820px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
h2 .sp{margin-left:auto}
h3{font-size:16px;margin:0 0 8px;text-wrap:balance}
.big{font-size:28px;font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi .big{font-size:clamp(15px,4.1vw,22px);white-space:nowrap}
.neg{color:var(--spend)}.pos{color:var(--income)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:10px}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.over span{background:var(--spend)}.meter.warn span{background:var(--warn)}
.cats{display:grid;gap:10px}
.cat-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center}
.cat-row .bar{height:10px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden}
.cat-row .bar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.cat-row .bar.over span{background:var(--spend)}
.cat-row .v{text-align:right;font-size:13px}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .m{min-width:0}
.li .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{text-align:right}
.day{width:40px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.day b{display:block;font-size:16px;color:var(--ink);font-family:var(--f-num)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--spend-soft);color:var(--spend)}.chip.info{background:var(--income-soft);color:var(--income)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:150px;font-family:var(--f-num);font-size:12.5px;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;border-top:0;white-space:nowrap}
td.r,th.r{text-align:right}
.tx-cat{padding:3px 6px;font-size:12px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.inst{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.inst:first-child{border-top:0}
.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.inst .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.parsed{display:grid;gap:6px;margin-top:10px}
.prose{max-width:72ch}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:20px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
@media (max-width:820px){.flow{grid-template-columns:1fr}}
.flow div{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:12.5px;min-width:0}
.flow div b{display:block;font-size:13px;margin-bottom:4px;color:var(--accent)}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-num)}
.yes{color:var(--ok);font-weight:600}.no{color:var(--spend);font-weight:600}.mid{color:var(--warn);font-weight:600}
.form-row{display:grid;grid-template-columns:110px 1fr 120px 120px auto;gap:8px}
@media (max-width:820px){.form-row{grid-template-columns:1fr 1fr}}
.empty{color:var(--muted);text-align:center;padding:24px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap row">
    <div class="brand"><i>₩</i>우리집 가계부</div>
    <span class="proto">프로토타입 · 예시 데이터</span>
    <div class="month">

  <nav class="wrap tabs" role="tablist" id="tabs">

    <button role="tab" data-tab="tx">거래내역</button>

</header>

<main class="wrap" id="view"></main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const CATS=["식비","카페·간식","교통","쇼핑","생활","주거·관리비","보험","통신","구독","의료","문화·여가","대출이자","기타","이체","수입","미분류"];
const NON_SPEND=new Set(["이체","수입"]);
const METHOD={api:{t:"스크래핑 API",c:"acc"},mydata:{t:"마이데이터",c:"acc"},sms:{t:"문자·알림",c:"info"},csv:{t:"CSV 업로드",c:""},email:{t:"이메일 청구서",c:""},manual:{t:"수기",c:""}};
const TYPE={card:"카드",bank:"은행",insurance:"보험",telecom:"통신",loan:"대출"};
const KEYWORDS={
 "식비":["김밥","배달의민족","배민","요기요","쿠팡이츠","식당","국밥","맥도날드","버거킹","본죽","한솥","분식","치킨","피자"],
 "카페·간식":["스타벅스","투썸","이디야","메가커피","메가MGC","컴포즈","빽다방","CU","GS25","세븐일레븐","파리바게뜨","뚜레쥬르","배스킨"],
 "교통":["카카오T","택시","티머니","코레일","SRT","주유","GS칼텍스","SK에너지","S-OIL","하이패스"],
 "쇼핑":["쿠팡","무신사","11번가","G마켓","올리브영","다이소","네이버페이","29CM","지그재그"],
 "생활":["이마트","홈플러스","롯데마트","컬리","노브랜드","세탁"],
 "주거·관리비":["관리비","도시가스","한국전력","한전","수도요금"],
 "보험":["생명","화재","손해보험","보험료"],
 "통신":["SK텔레콤","SKT","KT ","케이티","LGU+","LG유플러스","통신요금","알뜰폰"],
 "구독":["넷플릭스","NETFLIX","유튜브","YouTube","멜론","쿠팡와우","디즈니","티빙","웨이브","OpenAI","Claude.ai"],
 "의료":["약국","병원","의원","치과","한의원"],
 "문화·여가":["CGV","메가박스","롯데시네마","인터파크","YES24","교보문고","헬스","필라테스"],
 "대출이자":["대출이자","이자출금"],
 "이체":["카드대금","카드결제대금","결제대금","내계좌"],
 "수입":["급여","월급","상여","이자입금"]
};
const KEY="hb-proto-v1";
let S=null, tab="dash", txFilter={cat:"",src:"",q:""};
const $=s=>document.querySelector(s);
const won=n=>(n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("ko-KR")+"원";
const man=n=>{const a=Math.abs(n);return a>=10000?(Math.round(a/1000)/10).toLocaleString("ko-KR")+"만":a.toLocaleString("ko-KR")};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const today=new Date();
const todayStr=today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate());
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return null}

/* ---------- categorisation ---------- */
function classify(merchant){
  const m=(merchant||"");
  for(const r of S.rules){ if(m.includes(r.pattern)) return r.category; }
  for(const [cat,list] of Object.entries(KEYWORDS)){ if(list.some(k=>m.includes(k.trim())||m.toUpperCase().includes(k.trim().toUpperCase()))) return cat; }
  return "미분류";
}
const norm=s=>(s||"").replace(/[\s()㈜\-_.]/g,"").replace(/(주식회사|점$)/g,"").slice(0,6);
const dedupKey=t=>t.date+"|"+Math.abs(t.amount)+"|"+norm(t.merchant);

/* ---------- sample data ---------- */
function seed(){
  let x=20261118; const rnd=()=>{x=(x*16807)%2147483647;return (x-1)/2147483646};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const inst=[
    {id:"shc",name:"신한카드",short:"신한",type:"card",method:"sms",status:"ok"},
    {id:"hdc",name:"현대카드",short:"현대",type:"card",method:"csv",status:"ok"},
    {id:"kb",name:"KB국민은행",short:"KB",type:"bank",method:"api",status:"ok"},
    {id:"tb",name:"토스뱅크",short:"토스",type:"bank",method:"api",status:"reauth"},
    {id:"sl",name:"삼성생명",short:"생명",type:"insurance",method:"api",status:"ok"},
    {id:"skt",name:"SK텔레콤",short:"SKT",type:"telecom",method:"email",status:"ok"},
    {id:"ln",name:"KB 주택담보대출",short:"대출",type:"loan",method:"api",status:"ok"}
  ];
  const now=new Date(); inst.forEach((i,k)=>{const d=new Date(now.getTime()-(k*37+5)*60000*(i.status==="reauth"?60:1));i.last=d.toISOString()});
  const accounts=[
    {id:"a1",inst:"kb",name:"KB 주거래 통장",kind:"asset",balance:4820000},
    {id:"a2",inst:"tb",name:"토스뱅크 파킹통장",kind:"asset",balance:12500000},
    {id:"a3",inst:"sl",name:"삼성생명 변액연금 (해지환급금)",kind:"asset",balance:8340000},
    {id:"a4",inst:"ln",name:"주택담보대출 잔액",kind:"liability",balance:-182000000},
    {id:"a5",inst:"shc",name:"신한카드 이번 달 결제 예정",kind:"liability",balance:0},
    {id:"a6",inst:"hdc",name:"현대카드 이번 달 결제 예정",kind:"liability",balance:0}
  ];
  const daily=[["스타벅스 강남R점","shc",4800,7600],["메가MGC커피","shc",2000,4500],["GS25 역삼점","hdc",2500,9800],["김밥천국","shc",6500,9500],["배달의민족","hdc",17000,32000],["카카오T 택시","shc",6800,18000],["쿠팡","hdc",12000,68000],["이마트 성수점","shc",35000,120000],["올리브영","hdc",9000,42000],["티머니 교통","shc",1400,2900],["CGV 왕십리","hdc",14000,30000],["온누리약국","shc",4000,16000],["한솥도시락","shc",5800,8900],["다이소","hdc",3000,15000],["동네 국밥","shc",9000,11000]];
  const fixed=[
    {d:5,m:"넷플릭스",inst:"shc",a:-17000,src:"sms"},
    {d:10,m:"삼성생명 보험료",inst:"kb",a:-186000,src:"api"},
    {d:12,m:"YouTube Premium",inst:"hdc",a:-14900,src:"csv"},
    {d:14,m:"신한카드 결제대금",inst:"kb",a:-1240000,src:"api",cat:"이체"},
    {d:15,m:"KB 대출이자출금",inst:"kb",a:-468000,src:"api"},
    {d:21,m:"SK텔레콤 통신요금",inst:"hdc",a:-89000,src:"csv"},
    {d:25,m:"급여 (주)한빛테크",inst:"kb",a:3850000,src:"api"},
    {d:25,m:"래미안 관리비",inst:"kb",a:-243000,src:"api"},
    {d:27,m:"DB손해보험 실손 보험료",inst:"kb",a:-42000,src:"api"}
  ];
  const tx=[]; let id=1;
  S={inst,accounts,tx,rules:[],recurring:[],budget:{total:2400000,cats:{"식비":550000,"카페·간식":120000,"교통":150000,"쇼핑":300000,"생활":350000,"문화·여가":100000,"의료":80000}},seq:0};
  for(let mo=2;mo>=0;mo--){
    const base=new Date(now.getFullYear(),now.getMonth()-mo,1);
    const last=mo===0?now.getDate():new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
    for(let d=1;d<=last;d++){
      const date=base.getFullYear()+"-"+pad(base.getMonth()+1)+"-"+pad(d);
      const n=1+Math.floor(rnd()*3);
      for(let k=0;k<n;k++){const [m,i,lo,hi]=pick(daily);const a=-Math.round((lo+rnd()*(hi-lo))/100)*100;
        const it=inst.find(z=>z.id===i);tx.push({id:id++,date,amount:a,merchant:m,inst:i,src:it.method==="csv"?"csv":"sms",category:null});}

function compare(prev,dayNow,spend){
  const p=prev.filter(t=>+t.date.slice(8)<=dayNow);const ps=spendOf(p);if(!ps)return "—";
  const d=(spend-ps)/ps*100;return `<span class="${d>0?"neg":"pos"}">${d>0?"▲":"▼"} ${Math.abs(d).toFixed(0)}%</span>`;
}
const byDate=(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;
function cumChart(cur,prev){
  const W=640,H=220,L=44,R=12,T=12,B=26,dim=31;
  const series=list=>{const arr=new Array(32).fill(0);list.filter(t=>t.amount<0&&!NON_SPEND.has(t.category)).forEach(t=>arr[+t.date.slice(8)]-=t.amount);let s=0;return arr.map(v=>s+=v)};
  const c=series(cur),p=series(prev);
  const isCur=S.month===ym(today),lastDay=isCur?today.getDate():daysIn(S.month),pDays=daysIn(shiftMonth(S.month,-1));
  const max=Math.max(S.budget.total,c[lastDay],p[pDays])*1.08;
  const step=max>3e6?1e6:5e5,top=Math.ceil(max/step)*step;
  const X=d=>L+(d-1)/(dim-1)*(W-L-R),Y=v=>T+(1-v/top)*(H-T-B);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v/1e4}만</text>`;
  [1,8,15,22,29].forEach(d=>g+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle">${d}일</text>`);
  const path=(arr,n)=>{let s="";for(let d=1;d<=n;d++)s+=(d===1?"M":"L")+X(d).toFixed(1)+" "+Y(arr[d]).toFixed(1);return s};
  const cp=path(c,lastDay);
  const area=cp+`L${X(lastDay)} ${Y(0)}L${X(1)} ${Y(0)}Z`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 누적 지출 그래프">${g}
   <line x1="${L}" x2="${W-R}" y1="${Y(S.budget.total)}" y2="${Y(S.budget.total)}" stroke="var(--spend)" stroke-dasharray="4 4" opacity=".6"/>
   <path d="${path(p,Math.min(pDays,dim))}" fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-width="1.5"/>
   <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
   <path d="${cp}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${X(lastDay)}" cy="${Y(c[lastDay])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
   <text x="${Math.min(X(lastDay),W-R-60)}" y="${Math.max(Y(c[lastDay])-10,T+10)}" style="fill:var(--ink);font-weight:600">${man(c[lastDay])}원</text></svg>`;
}

/* ---------- parsing ---------- */
const ISSUERS=["신한","KB국민","국민","현대","삼성","롯데","하나","우리","BC","비씨","NH농협","농협","카카오뱅크","토스뱅크","토스","씨티","IBK","기업","케이뱅크","SC제일"];
function parseSMS(text){
  const blocks=text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  return blocks.map(raw=>{
    const flat=raw.replace(/\[Web발신\]/g,"").trim();
    let issuer=ISSUERS.find(n=>flat.includes(n))||"";if(issuer==="국민")issuer="KB국민";
    const cancel=/취소/.test(flat), deposit=/입금/.test(flat)&&!/출금/.test(flat);
    let am=flat.match(/(\d{1,3}(?:,\d{3})+|\d+)\s*원/);
    if(!am)am=flat.match(/(?:입금|출금|승인)\s*(\d{1,3}(?:,\d{3})+|\d+)/);
    const amount=am?+am[1].replace(/,/g,""):0;
    const dm=flat.match(/(\d{1,2})[\/.](\d{1,2})(?:\s*(\d{1,2}:\d{2}))?/);
    let date=todayStr;
    if(dm){const m=+dm[1],d=+dm[2];let y=today.getFullYear();if(m>today.getMonth()+1)y--;date=y+"-"+pad(m)+"-"+pad(d)}
    let merchant="";
    if(dm){const after=flat.slice(dm.index+dm[0].length).split(/누적|잔액/)[0];
      merchant=after.split("\n").map(s=>s.trim()).filter(s=>s&&!/^\d[\d\-*]+$/.test(s)&&!/원\s*$/.test(s)&&!/^(입금|출금)/.test(s)).pop()||"";}
    if(!merchant){merchant=flat.split("\n").map(s=>s.trim()).filter(s=>s&&!/원/.test(s)&&!/\d{1,2}[\/.]\d{1,2}/.test(s)&&!/\*/.test(s)&&!ISSUERS.some(n=>s.startsWith(n))).pop()||""}
    merchant=merchant.replace(/^\s*(승인|일시불|할부\S*)\s*/,"").trim();
    const ok=amount>0&&merchant;
    const sign=deposit?1:-1;
    return {raw,ok,issuer,date,merchant:merchant||"(가맹점 미확인)",amount:cancel?-sign*amount:sign*amount,cancel,deposit};
  });
}
function instFromIssuer(s){
  if(!s)return null;
  const map={"신한":"shc","현대":"hdc","KB국민":"kb","토스":"tb","토스뱅크":"tb"};
  if(map[s])return map[s];
  let i=S.inst.find(x=>x.name.startsWith(s));
  if(!i){i={id:"i"+(S.seq++),name:s+(/(뱅크|은행)/.test(s)?"":"카드"),short:s.slice(0,2),type:/(뱅크|은행|하나|우리|기업|IBK|SC)/.test(s)?"bank":"card",method:"sms",status:"ok",last:new Date().toISOString()};S.inst.push(i)}
  return i.id;
}
function addTx(list,src){
  const keys=new Set(S.tx.map(dedupKey));let added=0,dup=0,offset=0;
  list.forEach(t=>{
    if(t.cancel){const orig=S.tx.find(o=>o.amount===-t.amount&&!o.canceled&&norm(o.merchant)===norm(t.merchant));
      if(orig){orig.canceled=true;S.tx.push({id:S.seq++,date:t.date,amount:t.amount,merchant:t.merchant+" (취소)",inst:t.inst,src,category:orig.category});offset++;return}
      t.merchant+=" (취소·원거래 없음)";}
    const k=dedupKey(t);if(keys.has(k)){dup++;return}
    keys.add(k);S.tx.push({id:S.seq++,date:t.date,amount:t.amount,merchant:t.merchant,inst:t.inst,src,category:t.category||classify(t.merchant)});added++;
  });
  save();return {added,dup,offset};
}
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  const clean=rows.filter(r=>r.some(c=>c.trim()));
  if(clean.length<2)return {err:"헤더와 1줄 이상의 데이터가 필요합니다."};
  const h=clean[0].map(s=>s.trim());
  const find=re=>h.findIndex(x=>re.test(x));
  const di=find(/일자|날짜|이용일|거래일|date/i),mi=find(/가맹점|이용처|내용|적요|사용처|merchant/i);
  const ai=find(/이용금액|^금액|결제금액|amount/i),oi=find(/출금/),ii=find(/입금/),ci=find(/카드|기관|은행/);
  if(di<0||mi<0||(ai<0&&oi<0))return {err:"날짜·가맹점·금액 열을 찾지 못했습니다. 첫 줄의 열 이름을 확인하세요: "+h.join(", ")};
  const num=s=>+(String(s||"").replace(/[^\d.-]/g,""))||0;
  const out=clean.slice(1).map(r=>{let d=(r[di]||"").trim().replace(/[.\/]/g,"-").replace(/\s.*/,"");const p=d.split("-");if(p.length===3)d=(p[0].length===2?"20"+p[0]:p[0])+"-"+pad(+p[1])+"-"+pad(+p[2]);
    let amount=ai>=0?-Math.abs(num(r[ai])):(num(r[ii])>0?num(r[ii]):-num(r[oi]));
    return {date:d,merchant:(r[mi]||"").trim(),amount,inst:ci>=0?instFromIssuer((r[ci]||"").replace(/카드|은행/,"").trim()):null}}).filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&t.amount);
  return {rows:out};
}

    S.rules=S.rules.filter(r=>r.pattern!==pattern);S.rules.unshift({pattern,category:sel.value});
    let n=0;S.tx.forEach(o=>{if(o!==t&&o.merchant.includes(pattern)&&o.category!==sel.value){o.category=sel.value;n++}});
    save();toast(`"${pattern}" → ${sel.value} 규칙 저장${n?` · 다른 거래 ${n}건도 변경`:""}`);render();});

  const at=$("#addTx");if(at)at.onsubmit=e=>{e.preventDefault();const amt=Math.abs(+$("#nAmount").value)*+$("#nType").value;
    const r=addTx([{date:$("#nDate").value,merchant:$("#nMerchant").value.trim(),amount:amt,inst:null,category:amt>0?"수입":null}],"manual");toast(r.added?"추가했습니다":"같은 거래가 이미 있습니다");render()};
  const ar=$("#addRec");if(ar)ar.onsubmit=e=>{e.preventDefault();S.recurring.push({id:S.seq++,name:$("#rName").value.trim(),match:$("#rMatch").value.trim(),amount:Math.abs(+$("#rAmount").value),day:+$("#rDay").value,category:classify($("#rMatch").value)!=="미분류"?classify($("#rMatch").value):"기타",inst:null});save();toast("고정지출을 추가했습니다");render()};
  document.querySelectorAll("[data-delrec]").forEach(b=>b.onclick=()=>{S.recurring=S.recurring.filter(r=>r.id!==+b.dataset.delrec);save();render()});
  document.querySelectorAll("[data-addrec]").forEach(b=>b.onclick=()=>{const m=b.dataset.addrec;const t=S.tx.filter(x=>x.merchant===m).sort(byDate)[0];
    S.recurring.push({id:S.seq++,name:m,match:m.split(" ")[0],amount:Math.abs(t.amount),day:+t.date.slice(8),category:t.category,inst:t.inst});save();toast("고정지출로 등록했습니다");render()});
  const sp=$("#smsParse");if(sp){
    const preview=()=>{const res=parseSMS($("#smsIn").value);$("#smsOut").innerHTML=res.map(r=>`<div class="li"><span class="chip ${r.ok?(r.cancel?"warn":"ok"):"bad"}">${r.ok?(r.cancel?"취소":r.deposit?"입금":"승인"):"검토 필요"}</span><div class="m"><b>${esc(r.merchant)}</b><span class="sub">${esc(r.issuer||"발신 기관 미확인")} · ${r.date} · ${esc(classify(r.merchant))}</span></div><div class="amt num ${r.amount>0?"pos":""}">${won(r.amount)}</div></div>`).join("")||`<div class="empty">인식된 문자가 없습니다</div>`;return res};
    sp.onclick=preview;
    $("#smsSave").onclick=()=>{const res=preview().filter(r=>r.ok);const r=addTx(res.map(x=>({...x,inst:instFromIssuer(x.issuer)})),"sms");toast(`${r.added}건 추가 · 중복 ${r.dup}건 제외${r.offset?` · 취소 상계 ${r.offset}건`:""}`)};
    preview();
    $("#csvFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let t=rd.result;if(t.includes("�")){const r2=new FileReader();r2.onload=()=>{$("#csvIn").value=r2.result};r2.readAsText(f,"euc-kr")}else $("#csvIn").value=t};rd.readAsText(f,"utf-8")};
    $("#csvSave").onclick=()=>{const p=parseCSV($("#csvIn").value);if(p.err){$("#csvOut").innerHTML=`<div class="note neg">${esc(p.err)}</div>`;return}
      const r=addTx(p.rows,"csv");$("#csvOut").innerHTML=`<div class="note">${p.rows.length}행 읽음 · <b>${r.added}건 추가</b> · 중복 ${r.dup}건 제외. 미분류 건은 거래내역 탭에서 카테고리를 지정하세요.</div>`;};
  }
  document.querySelectorAll("[data-sync]").forEach(b=>b.onclick=()=>{const i=S.inst.find(x=>x.id===b.dataset.sync);i.status="syncing";render();
    setTimeout(()=>{const pool={card:[["스타벅스 서초점",-6100],["쿠팡",-23400],["배달의민족",-21500]],bank:[["이자입금",1240],["카카오페이 송금",-30000]],insurance:[],telecom:[],loan:[]}[i.type]||[];
      const n=pool.length?1+Math.floor(Math.random()*2):0;const items=[];for(let k=0;k<n;k++){const [m,a]=pool[Math.floor(Math.random()*pool.length)];items.push({date:todayStr,merchant:m,amount:a,inst:i.id})}
      const r=addTx(items,i.method==="mydata"?"mydata":"api");i.status="ok";i.last=new Date().toISOString();save();toast(`${i.name}: 새 거래 ${r.added}건 (시뮬레이션)`);render()},900)});
  document.querySelectorAll("[data-reauth]").forEach(b=>b.onclick=()=>{const i=S.inst.find(x=>x.id===b.dataset.reauth);i.status="ok";i.last=new Date().toISOString();save();toast(`${i.name} 간편인증 완료 (시뮬레이션)`);render()});
}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;render()};
$("#prevM").onclick=()=>{S.month=shiftMonth(S.month,-1);render()};
$("#nextM").onclick=()=>{if(S.month<ym(today)){S.month=shiftMonth(S.month,1);render()}};

S=load()||seed();
if(!S.month)S.month=ym(today);
render();
})();
</script>
