<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>우리집 가계부</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: single mobile column (max 480px) — sticky header, hairline-ruled sections, fixed text-only bottom tab bar.
   Monochrome system; one accent (cobalt) for data/active state, one alert (vermilion) for over-budget & missing items.
   No radii, no pills, no icon tiles: hierarchy comes from type size, weight and 1px rules. */
:root{
  --bg:#F4F4F3; --surface:#FFFFFF; --ink:#111111; --ink-2:#3A3A3A; --muted:#7A7A7A; --line:#E2E2E0; --line-strong:#111111; --track:#ECECEA;
  --accent:#2448E8; --alert:#D9361E;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:58px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#141414; --ink:#F2F2F2; --ink-2:#CFCFCF; --muted:#8C8C8C; --line:#262626; --line-strong:#F2F2F2; --track:#232323;
  --accent:#7D95FF; --alert:#FF6E57; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#141414; --ink:#F2F2F2; --ink-2:#CFCFCF; --muted:#8C8C8C; --line:#262626; --line-strong:#F2F2F2; --track:#232323;
  --accent:#7D95FF; --alert:#FF6E57; color-scheme:dark}
*{box-sizing:border-box;border-radius:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--surface);border-inline:1px solid var(--line);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:12px;height:56px}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.top .tag{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.month{margin-left:auto;display:flex;align-items:center}
.month button{width:32px;height:32px;font-size:18px;color:var(--ink-2)}
.month button:disabled{color:var(--line)}
.month b{font-family:var(--f-num);font-weight:500;font-size:14px;min-width:68px;text-align:center}
.back{font-size:14px;color:var(--ink-2)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:6;background:var(--surface);border-top:1px solid var(--line-strong);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{height:var(--nav-h);font-size:12.5px;font-weight:500;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button small{font-family:var(--f-num);font-size:9.5px;letter-spacing:.08em;color:var(--muted)}
.nav button[aria-selected="true"]{color:var(--ink);font-weight:700}
.nav button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:0;right:0;height:3px;background:var(--ink)}

/* sections */
.sec{padding-block:22px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.label{font-family:var(--f-num);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:baseline;gap:8px;font-weight:500}
.label .r{margin-left:auto;letter-spacing:0;text-transform:none;font-family:var(--f-body);font-size:12px}
.link{color:var(--accent);font-size:12.5px;font-weight:500}
.hero{font-size:clamp(34px,10vw,44px);font-weight:500;line-height:1.05;margin:4px 0 6px;letter-spacing:-.05em}
.hero small{font-size:.42em;font-family:var(--f-body);letter-spacing:0;margin-left:4px;font-weight:500}
.cap{color:var(--muted);font-size:12.5px}
.up{color:var(--alert)}.down{color:var(--accent)}
.acc{color:var(--accent)}.alert{color:var(--alert)}

.track{height:2px;background:var(--track);margin-top:14px;position:relative}
.track span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.track.over span{background:var(--alert)}
.track i{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink)}

.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.stats div{padding:16px 0;min-width:0}
.stats div:nth-child(odd){padding-right:16px;border-right:1px solid var(--line)}
.stats div:nth-child(even){padding-left:16px}
.stats div:nth-child(n+3){border-top:1px solid var(--line)}
.stats b{display:block;font-size:19px;font-weight:500;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* category lines */
.cats{display:grid;gap:16px}
.cat .h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.cat .h em{font-style:normal;color:var(--muted)}
.cat .track{margin-top:7px}

/* rows */
.rows{display:grid}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{font-family:var(--f-num);font-size:15px;font-weight:500}
.row .d small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400}
.row .m{min-width:0}
.row .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11.5px;color:var(--muted)}
.row .meta .sep{margin:0 5px;color:var(--line)}
.row .a{text-align:right;font-size:14.5px}
.row.void .a{text-decoration:line-through;color:var(--muted)}
.row .a small{display:block;font-family:var(--f-body);font-size:11.5px;letter-spacing:0}
.pos{color:var(--accent)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-num)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}

/* controls */
.field{display:grid;gap:6px}
.field label{font-size:11.5px;color:var(--muted)}
select,input,textarea{background:var(--surface);border:1px solid var(--line);padding:9px 10px;min-width:0;width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:170px;font-family:var(--f-num);font-size:12px;line-height:1.55;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border:1px solid var(--ink);font-weight:600;font-size:14px}
.btn.solid{background:var(--ink);color:var(--surface)}
.btn.block{width:100%}
.btn.sm{height:30px;padding:0 10px;font-size:12px;font-weight:500}
.btn:disabled{border-color:var(--line);color:var(--muted);cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input{grid-column:1/-1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.tx-cat,[data-bulk]{border:0;border-bottom:1px solid var(--line);padding:2px 18px 2px 0;font-size:11.5px;width:auto;background-position:calc(100% - 9px) 50%,calc(100% - 4px) 50%;color:var(--ink-2)}
.rules{display:grid}
.rules div{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.rules div:first-child{border-top:0}
.note{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--ink);padding:2px 0 2px 12px;margin:0}
.empty{color:var(--muted);padding:20px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 16px;font-size:13px;z-index:20;width:min(calc(100% - 40px),440px)}

/* text tables (key/value) */
.kv{display:grid}
.kv div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.kv div:first-child{border-top:0}
.kv dt,.kv .k{color:var(--muted);font-size:12px}
.method{padding:16px 0;border-top:1px solid var(--line)}
.method:first-child{border-top:0;padding-top:0}
.method h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.method h4 span{font-size:12px;font-weight:600}
.method dl{display:grid;grid-template-columns:72px 1fr;gap:4px 12px;margin:0;font-size:12.5px}
.method dt{color:var(--muted)}
.method dd{margin:0}
.seq{list-style:none;margin:0;padding:0;display:grid}
.seq li{display:grid;grid-template-columns:36px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}
.seq li:first-child{border-top:0;padding-top:0}
.seq li::before{content:attr(data-n);font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:1px}
.seq b{display:block;font-size:14px;margin-bottom:2px}
.seq .cap{display:block}
h2.title{font-size:22px;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance;font-weight:700}
.prose p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}
.inst{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.inst:first-child{border-top:0;padding-top:0}
.inst b{font-weight:600}
.inst .r{display:flex;gap:12px;align-items:center;font-size:12px}
.banner{background:var(--bg)}
.mute{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const CARD_BILL=/(우리|현대|삼성|신한|KB|국민|롯데|하나|BC|비씨|농협|NH)\s*카드|카드\s*(대금|결제)/;
function classify(merchant,inst,amount){
  const m=merchant||"";
  for(const r of S.rules){ if(m.includes(r.pattern)) return r.category; }
  const it=S.inst.find(i=>i.id===inst);
  if(it&&it.type==="bank"&&CARD_BILL.test(m)) return "이체";
  // 연동 탭 설정: 생활비를 보내는 가족 → 지출(가족 생활비), 본인 다른 계좌 → 이체
  // 은행 적요는 '국민홍길동', '금고김영희'처럼 은행 이름이 앞에 붙으므로 포함 여부로 봄
  const who=m.replace(/\s/g,"");
  // 가족에게서 들어온 돈은 가족 소득(수입). 1천만원 이상 목돈은 자산 거래
  if(it&&it.type==="bank"&&(S.family||[]).some(n=>n&&who.includes(n))) return amount>0?(amount>=BIG_MOVE?"자산 거래":"수입"):"가족 생활비";
  if(it&&it.type==="bank"&&(S.self||[]).some(n=>n&&who.includes(n))) return "이체";
  for(const [cat,list] of Object.entries(KEYWORDS)){ if(list.some(k=>m.toUpperCase().includes(k.trim().toUpperCase()))) return cat; }
  return "미분류";
}

const byDate=(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;
function cumChart(cur,prev){
  const W=440,H=180,L=34,R=6,T=10,B=22,dim=31;
  const series=list=>{const arr=new Array(32).fill(0);list.forEach(t=>arr[+t.date.slice(8)]+=spendVal(t));let s=0;return arr.map(v=>s+=v)};
  const c=series(cur),p=series(prev);
  const isCur=S.month===ym(today),lastDay=isCur?today.getDate():daysIn(S.month),pDays=daysIn(shiftMonth(S.month,-1));
  const max=Math.max(S.budget.total,c[lastDay],p[pDays])*1.05;
  const step=max>3e6?1e6:5e5,top=Math.ceil(max/step)*step;
  const X=d=>L+(d-1)/(dim-1)*(W-L-R),Y=v=>T+(1-v/top)*(H-T-B);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${Y(v)+3}">${v/1e4}만</text>`;
  [1,10,20,30].forEach(d=>g+=`<text x="${X(d)}" y="${H-5}" text-anchor="middle">${d}</text>`);
  const path=(arr,n)=>{let s="";for(let d=1;d<=n;d++)s+=(d===1?"M":"L")+X(d).toFixed(1)+" "+Y(arr[d]).toFixed(1);return s};
  const ex=X(lastDay),ey=Y(c[lastDay]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 누적 지출 그래프">${g}
   <line x1="${L}" x2="${W-R}" y1="${Y(S.budget.total)}" y2="${Y(S.budget.total)}" stroke="var(--alert)" stroke-dasharray="3 3"/>
   <path d="${path(p,Math.min(pDays,dim))}" fill="none" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="1 3" stroke-linecap="round"/>
   <path d="${path(c,lastDay)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="miter"/>
   <line x1="${ex}" x2="${ex}" y1="${ey}" y2="${Y(0)}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 2"/>
   <text x="${Math.min(ex+6,W-R-56)}" y="${Math.max(ey-8,T+8)}" style="fill:var(--ink);font-weight:600;font-size:11px">${man(c[lastDay])}원</text></svg>`;
}

/* ---------- SMS parsing ---------- */
function detectInst(flat){
  const has=s=>flat.includes(s);
  const card=/(카드|승인|일시불|할부|누적)/.test(flat);
  if(has("새마을")||/\bMG\b|\[MG/.test(flat)) return "mg";
  if(has("현대카드")||(has("현대")&&card)) return "hc";
  if(has("삼성카드")||(has("삼성")&&card&&!has("삼성생명")&&!has("삼성화재"))) return "sc";
  if(has("우리카드")||(has("우리")&&card)) return "wc";
  if(has("우리은행")||has("우리")) return "wb";
  return null;
}
const OTHER_ISSUERS=["신한","KB국민","국민","롯데","하나","BC","비씨","NH농협","농협","카카오뱅크","토스뱅크","케이뱅크","IBK","SC제일","씨티"];
function parseSMS(text){
  const blocks=text.replace(/\r/g,"").split(/\n\s*\n|(?=\[Web발신\])/).map(s=>s.trim()).filter(s=>s&&s!=="[Web발신]");
  return blocks.map(raw=>{
    const flat=raw.replace(/\[Web발신\]|\(광고\)/g,"").trim();
    const inst=detectInst(flat);
    const issuer=inst?null:(OTHER_ISSUERS.find(n=>flat.includes(n))||"");
    const cancel=/취소/.test(flat);
    const deposit=/입금/.test(flat)&&!/출금|승인/.test(flat);
    const withdraw=/출금|이체|자동이체/.test(flat)&&!deposit;
    // 첫 금액 (누적·잔액 금액은 제외)
    let amount=0;const re=/(누적|잔액|한도)?\s*[:：]?\s*(\d{1,3}(?:,\d{3})+|\d+)\s*원/g;let mm;
    while((mm=re.exec(flat))){if(!mm[1]){amount=+mm[2].replace(/,/g,"");break}}
    if(!amount){const m2=flat.match(/(?:입금|출금|승인)\s*(\d{1,3}(?:,\d{3})+|\d+)/);if(m2)amount=+m2[1].replace(/,/g,"")}
    const dm=flat.match(/(?:(\d{4})[\/.])?(\d{1,2})[\/.](\d{1,2})(?:\s*(\d{1,2}:\d{2}))?/);
    let date=todayStr;
    if(dm){const m=+dm[2],d=+dm[3];let y=dm[1]?+dm[1]:today.getFullYear();if(!dm[1]&&m>today.getMonth()+1)y--;if(m>=1&&m<=12&&d>=1&&d<=31)date=y+"-"+pad(m)+"-"+pad(d)}
    const junk=s=>!s||/원\s*$/.test(s)||/^(누적|잔액|한도)/.test(s)||/\*/.test(s)||/님$/.test(s)||/^[\d\-\s]+$/.test(s)||/^(입금|출금|승인|일시불|할부)/.test(s)||/^\[.*\]$/.test(s)||(/(승인|취소)/.test(s)&&/(카드|우리|현대|삼성|은행|금고)/.test(s)&&s.length<20);
    let merchant="";
    if(dm){const after=flat.slice(dm.index+dm[0].length).split(/누적|잔액/)[0];
      merchant=after.split("\n").map(s=>s.trim()).filter(s=>!junk(s))[0]||"";}
    if(!merchant){const lines=flat.split("\n").map(s=>s.trim()).filter(s=>!junk(s)&&!/\d{1,2}[\/.]\d{1,2}/.test(s));merchant=lines.pop()||""}
    merchant=merchant.replace(/^\s*(승인|일시불|할부\S*)\s*/,"").replace(/\s+(일시불|할부\S*)$/,"").trim();
    const ok=amount>0&&!!merchant;
    const sign=deposit?1:-1;
    return {raw,ok,inst,issuer,date,merchant:merchant||"(가맹점 미확인)",amount:cancel?-sign*amount:sign*amount,cancel,deposit,withdraw};
  });
}

   형식 예: "8.30(일)" 날짜 줄 → 가맹점 줄 → "16:32 · 네이버 현대카드 · 일시불" → "7,000원" (+ "거래취소")

function parseListText(text,fallbackInst){
  const lines=text.replace(/\r/g,"").split("\n").map(s=>s.trim()).filter(Boolean);
  const SKIP=/적립|인카페이먼트|차 안에서|이용\s*내역\s*보기|맨\s*위로|^SAMSUNG|^Pay$|^[<>‹›]|월\s*[▾▼]|^\d{1,2}월$|^[일월화수목금토]$|^\d{1,2}$|^[\d,]+$|상세이용내역|청구|결제예정/;

    if(!date)continue;
    if(am){const a={v:+am[3].replace(/,/g,""),neg:am[2]==="-"};
      if(am[1]&&!/누적|잔액|한도|합계|총/.test(am[1])){items.push({merchant:am[1],date,amount:a.v,neg:a.neg,inst:null,cancel:false});continue}
      if(/누적|잔액|한도/.test(am[1]))continue;
      const it=merchQ.shift();if(it)pair(it,a);else amtQ.push(a);continue}
    const it={merchant:ln,date,amount:null,inst:null,cancel:false};items.push(it);
    const a=amtQ.shift();if(a)pair(it,a);else merchQ.push(it);
  }
  return items.map(it=>{const inst=it.inst||lastInst||fallbackInst||null;const ok=!!it.amount&&!it.cancel;
    return {raw:it.merchant,ok,inst,issuer:"",date:it.date,merchant:it.merchant+(it.cancel?" (거래취소 · 제외)":it.amount?"":" (금액 미확인)"),
      amount:it.neg?(it.amount||0):-(it.amount||0),cancel:!!it.neg,deposit:false,withdraw:false,listCancel:it.cancel}});
}
function instFromIssuer(s){

/* ---------- add with dedup ---------- */
function addTx(list,src){
  // key: 원본 가맹점명 (취소 행은 표시용 이름에 "(취소)"가 붙으므로 원문을 따로 보관)
  const k1=t=>t.date+"|"+t.amount+"|"+(t.inst||"")+"|"+norm(t.key||t.merchant);
  const k2=t=>t.date+"|"+t.amount+"|"+(t.inst||"");
  const exact={},loose={},seen={};
  S.tx.forEach(t=>{exact[k1(t)]=(exact[k1(t)]||0)+1;(loose[k2(t)]=loose[k2(t)]||[]).push(t.src)});
  let added=0,dup=0,offset=0;const newRows=[];
  // 원거래를 먼저 넣고 취소를 나중에 처리 → 같은 파일 안에서 순서와 관계없이 상계
  list.filter(t=>!t.cancel).concat(list.filter(t=>t.cancel)).forEach(t=>{
    const a=k1(t);seen[a]=(seen[a]||0)+1;
    if(seen[a]<=(exact[a]||0)){dup++;return}
    const l=loose[k2(t)];const idx=l?l.findIndex(s=>s!==src):-1;
    if(idx>=0){l.splice(idx,1);dup++;return}
    if(t.cancel){
      const same=o=>norm(o.merchant)===norm(t.merchant);
      const c=S.tx.filter(o=>o.amount===-t.amount&&!o.canceled&&!o.refund&&(!t.inst||o.inst===t.inst));
      const orig=c.find(o=>o.date===t.date&&same(o))||c.filter(o=>same(o)&&o.date<=t.date).sort(byDate)[0]||c.find(o=>o.date===t.date);
      const row={id:S.seq++,date:t.date,amount:t.amount,key:t.merchant,inst:t.inst||(orig&&orig.inst),src,refund:true,
        merchant:orig?orig.merchant+" (취소)":t.merchant+" (취소·원거래 없음)",category:orig?orig.category:classify(t.merchant,t.inst)};
      if(orig){orig.canceled=true;row.cancelOf=orig.id;offset++}else added++;
      S.tx.push(row);return}
    const row={id:S.seq++,date:t.date,amount:t.amount,merchant:t.merchant,inst:t.inst,src,category:t.category||classify(t.merchant,t.inst,t.amount)};
    if(isBank(row.inst)&&Math.abs(row.amount)>=BIG_MOVE&&!["수입","이체","자산 거래"].includes(row.category)&&!ruleHit(row.merchant))row.category="자산 거래";
    S.tx.push(row);newRows.push(row);added++;
  });
  const paired=pairTransfers(newRows);
  const touched=new Set(list.map(t=>t.inst));S.inst.forEach(i=>{if(touched.has(i.id))i.last=new Date().toISOString()});
  save();return {added,dup,offset,paired};
}
const isBank=id=>(S.inst.find(i=>i.id===id)||{}).type==="bank";
const ruleHit=m=>S.rules.some(r=>(m||"").includes(r.pattern));
/* 내 계좌 간 이체 자동 인식: 서로 다른 은행에서 같은 금액이 ±1일 안에 한쪽은 출금, 한쪽은 입금이면 둘 다 '이체'
   (예: 새마을금고 → 우리은행 자동이체가 한쪽은 '신용대출', 다른 쪽은 '급여'로 찍혀 지출·수입이 이중으로 잡히는 것 방지) */
function pairTransfers(cands){
  // 보험·공제, 아동수당처럼 근거가 분명한 거래끼리 금액만 같아 묶이는 것을 막기 위해 후보 카테고리를 제한
  const OK=new Set(["미분류","이체","수입","대출상환"]);
  const dayDiff=(a,b)=>Math.abs(new Date(a)-new Date(b))/864e5;let n=0;
  const isFam=m=>(S.family||[]).some(n=>n&&(m||"").replace(/\s/g,"").includes(n));
  const can=x=>isBank(x.inst)&&!isFam(x.merchant)&&!x.xfer&&!x.refund&&!x.canceled&&Math.abs(x.amount)>=100000&&OK.has(x.category)&&!(x.category==="수입"&&/아동수당|양육수당|부모급여|이자|배당/.test(x.merchant));
  for(const t of cands){
    if(!can(t))continue;
    const o=S.tx.find(x=>x!==t&&can(x)&&x.inst!==t.inst&&x.amount===-t.amount&&dayDiff(x.date,t.date)<=1);
    if(o){t.xfer=o.id;o.xfer=t.id;t.category="이체";o.category="이체";n++}
  }
  return n;
}

/* ---------- Excel / CSV ---------- */
function parseCSVText(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
    else if(c==='"')q=true;else if(c===","||c==="\t"){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
  let s=String(v||"").trim();if(!s)return null;
  let m=s.match(/^(\d{4})(\d{2})(\d{2})/);if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/(\d{2,4})\s*[.\/\-년]\s*(\d{1,2})\s*[.\/\-월]\s*(\d{1,2})/);
  if(m){let y=+m[1];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[3])}
  m=s.match(/^(\d{1,2})[.\/\-](\d{1,2})$/);
  if(m){let y=today.getFullYear();if(+m[1]>today.getMonth()+1)y--;return y+"-"+pad(+m[1])+"-"+pad(+m[2])}
  return null;
}
const numOf=s=>{const t=String(s??"").replace(/[^\d.\-]/g,"");return t?+t||0:0};
// 은행 '거래구분' 열로 알 수 있는 분류 (예: 새마을금고 상환/공제/이자/배당)
const BANK_CH=/뱅킹|타행|당행|대체|펌뱅킹|오픈|비대면|지로|자동이체|CD|ATM|창구|입금|출금|이체|카드/;
function memoCat(memo,amount){
  if(/^상환$|대출상환|원리금|^대출이자$/.test(memo))return "대출상환";
  if(/^공제$/.test(memo))return "보험·공제";
  if(/^통신요금$/.test(memo))return "통신";
  if(/현금지급|현금인출|^CD$|^ATM/.test(memo)&&amount<0)return "현금";
  if(/^(이자|배당|결산)$/.test(memo)&&amount>0)return "수입";
  return null;
}
function mapRows(rows,inst){
  rows=rows.map(r=>(r||[]).map(c=>c==null?"":c));
  const H={
    date:/거래일시|거래일자|이용일자|승인일자|승인일시|이용일시|매출일자|이용일|승인일|거래일|일자|날짜|date/i,
    merch:[/가맹점명|이용가맹점|가맹점|이용하신\s*곳/,/기재내용|거래내용|받는분|보낸분|내용|상대/,/적요|이용처|사용처|비고|거래점/],
    amt:/이용금액|승인금액|결제금액|매출금액|사용금액|거래금액|^금액|amount/i,
    out:/출금|찾으신|지급/, inn:/입금|맡기신/, cancel:/취소|승인구분|상태/
  };
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i].map(c=>String(c).replace(/\s/g,""));
    if(r.some(c=>H.date.test(c))&&r.some(c=>H.amt.test(c)||H.out.test(c))){hi=i;break}}
  if(hi<0)return {err:"날짜·금액 열이 있는 제목 줄을 찾지 못했습니다. 파일의 열 이름을 알려주시면 맞춰 드릴 수 있습니다."};
  const h=rows[hi].map(c=>String(c).replace(/\s/g,""));
  const find=re=>h.findIndex(x=>re.test(x));
  const di=find(H.date);let mi=-1;for(const re of H.merch){mi=find(re);if(mi>=0)break}
  const oi=h.findIndex(x=>H.out.test(x)&&!/계좌|은행/.test(x)),ii=h.findIndex(x=>H.inn.test(x)&&!/계좌|은행/.test(x));
  const ai=(oi>=0&&ii>=0)?-1:find(H.amt);const ci=find(H.cancel);
  const memoI=h.findIndex((x,i)=>i!==mi&&/^적요$|^거래구분$|^구분$/.test(x));
  if(mi<0)return {err:"가맹점(내용) 열을 찾지 못했습니다. 제목 줄: "+h.filter(Boolean).join(", ")};
  const out=[];let skipped=0;const isCard=(S.inst.find(i=>i.id===inst)||{}).type==="card";
  rows.slice(hi+1).forEach(r=>{
    const memo=memoI>=0?String(r[memoI]||"").trim():"";
    const date=parseDate(r[di]);const merchant=String(r[mi]||"").trim()||memo;
    if(!date||!merchant||/^(합계|소계|총계)/.test(merchant)){if(r.some(c=>String(c).trim()))skipped++;return}
    let amount,cancel=false;
    if(ai>=0){const v=numOf(r[ai]);cancel=(ci>=0&&/취소/.test(String(r[ci])))||(v<0&&isCard);amount=cancel?Math.abs(v):-v}
    else{const vi=numOf(r[ii]),vo=numOf(r[oi]);amount=vi>0?vi:-vo}
    if(!amount){skipped++;return}
    // 스마트뱅킹·타행·대체 같은 '거래 경로' 단어는 분류 근거가 아님 (예: 스마트뱅킹의 '마트')
    const mc=memo?memoCat(memo,amount)||(BANK_CH.test(memo)?"미분류":classify(memo,inst)):"미분류";
    out.push({date,merchant,amount,inst,cancel,category:mc!=="미분류"?mc:null});
  });
  return {rows:out,skipped,header:h.filter(Boolean)};
}
let xlsxLoading=null;
function loadXLSX(){

  if(!xlsxLoading)xlsxLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxLoading=null;rej(new Error("엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 CSV로 저장해 올려 주세요."))};document.head.appendChild(s)});

function readText(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const t=r.result;if(t.includes(String.fromCharCode(0xFFFD))){const r2=new FileReader();r2.onload=()=>res(r2.result);r2.readAsText(file,"euc-kr")}else res(t)};r.readAsText(file,"utf-8")})}
/* ---------- PDF (은행 거래내역조회 PDF: 날짜 시간 구분 내용 출금액 입금액 잔액) ---------- */
let pdfLoading=null;
function loadPDF(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if(!pdfLoading)pdfLoading=new Promise((res,rej)=>{const s=document.createElement("script");s.src=base+"pdf.min.js";
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";res(window.pdfjsLib)};
    s.onerror=()=>{pdfLoading=null;rej(new Error("PDF 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."))};document.head.appendChild(s)});
  return pdfLoading;
}
async function pdfText(file){
  const lib=await loadPDF();let doc;
  try{doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}
  catch(e){throw new Error(/password/i.test(e.name+e.message)?"암호가 걸린 PDF입니다. 암호를 풀어 다시 저장하거나 엑셀로 받아 주세요.":"PDF를 열지 못했습니다.")}
  let text="";
  // 글자 단위로 쪼개진 PDF도 있어서 좌표로 이어 붙임: 같은 줄에서 간격이 벌어지면 공백, 줄이 바뀌면 줄바꿈
  for(let p=1;p<=doc.numPages;p++){const c=await(await doc.getPage(p)).getTextContent();let px=null,py=null;
    for(const i of c.items){const x=i.transform[4],y=i.transform[5],h=Math.abs(i.transform[3])||8;
      if(py!==null&&Math.abs(y-py)>h*0.5)text+="\n";else if(px!==null&&x-px>h*0.25)text+=" ";
      text+=i.str;px=x+(i.width||0);py=y;if(i.hasEOL){text+="\n";px=null}}
    text+="\n"}
  return text;
}
function bankRowsFromText(text){
  const t=text.replace(/\s+/g," ");
  const re=/(\d{4})[.\-\/](\d{2})[.\-\/](\d{2})(?:\s+(\d{2}:\d{2}(?::\d{2})?))?/g;
  const ms=[...t.matchAll(re)];const rows=[["거래일자","거래시간","거래구분","거래내용","출금액","입금액","잔액"]];
  ms.forEach((m,k)=>{
    const chunk=t.slice(m.index+m[0].length,k+1<ms.length?ms[k+1].index:t.length);
    const am=[...chunk.matchAll(/(-?[\d,]*\d)\s*원/g)];if(am.length<3)return;
    const head=chunk.slice(0,am[0].index).trim().split(" ");
    rows.push([m[1]+"."+m[2]+"."+m[3],m[4]||"",head[0]||"",head.slice(1).join(" "),am[0][1],am[1][1],am[2][1]]);
  });
  return rows;
}
async function fileRows(file){
  if(/\.csv$|\.txt$/i.test(file.name))return parseCSVText(await readText(file));
  if(/\.pdf$/i.test(file.name)){const txt=await pdfText(file);const rows=bankRowsFromText(txt);
    if(txt.replace(/\s/g,"").length<50)throw new Error("이 PDF는 글자 없이 그림으로만 되어 있어 읽을 수 없습니다 (보안메일을 '인쇄 → PDF'로 저장하면 이렇게 됩니다). 은행 앱·홈페이지에서 거래내역을 엑셀로 받아 올려 주세요.");
    if(rows.length<2)throw new Error("이 PDF에서 거래 줄(날짜·출금액·입금액·잔액)을 찾지 못했습니다. 은행 거래내역 PDF만 읽을 수 있습니다. 엑셀로 받아 올려 주세요.");
    return rows}
  const XLSX=await loadXLSX();
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  let best=[];wb.SheetNames.forEach(n=>{const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:""});if(r.length>best.length)best=r});
  return best;
}

// 카테고리 변경: 가맹점 첫 단어로 규칙을 저장하고 같은 가맹점 거래(전체 기간)에 모두 적용

}

  document.querySelectorAll(".tx-cat").forEach(sel=>sel.onchange=()=>setCat(S.tx.find(x=>x.id===+sel.dataset.id),sel.value));
  document.querySelectorAll("[data-bulk]").forEach(sel=>sel.onchange=()=>{if(sel.value)setCat(S.tx.find(x=>x.id===+sel.dataset.bulk),sel.value)});
  document.querySelectorAll("[data-delrule]").forEach(b=>b.onclick=()=>{S.rules.splice(+b.dataset.delrule,1);save();render()});
  const at=$("#addTx");if(at)at.onsubmit=e=>{e.preventDefault();const amt=Math.abs(+$("#nAmount").value)*+$("#nType").value;
    const r=addTx([{date:$("#nDate").value,merchant:$("#nMerchant").value.trim(),amount:amt,inst:null,category:amt>0?"수입":null}],"manual");toast(r.added?"추가했습니다":"같은 거래가 이미 있습니다");render()};
  const ar=$("#addRec");if(ar)ar.onsubmit=e=>{e.preventDefault();const c=classify($("#rMatch").value);S.recurring.push({id:S.seq++,name:$("#rName").value.trim(),match:$("#rMatch").value.trim(),amount:Math.abs(+$("#rAmount").value),day:+$("#rDay").value,category:c!=="미분류"?c:"기타",inst:null});save();toast("고정비를 추가했습니다");render()};
  document.querySelectorAll("[data-delrec]").forEach(b=>b.onclick=()=>{S.recurring=S.recurring.filter(r=>r.id!==+b.dataset.delrec);save();render()});
  document.querySelectorAll("[data-addrec]").forEach(b=>b.onclick=()=>{const m=b.dataset.addrec;const t=S.tx.filter(x=>x.merchant===m).sort(byDate)[0];
    S.recurring.push({id:S.seq++,name:m,match:m.split(" ")[0],amount:Math.abs(t.amount),day:+t.date.slice(8),category:t.category,inst:t.inst});save();toast("고정비로 등록했습니다");render()});
  const sp=$("#smsParse");if(sp){
    const isList=()=>looksLikeList($("#smsIn").value);
    const preview=()=>{const v=$("#smsIn").value,fb=$("#pasteInst").value||null;
      const res=isList()?parseListText(v,fb):parseSMS(v).map(r=>({...r,inst:r.inst||fb||instFromIssuer(r.issuer)}));$("#smsOut").innerHTML=smsRows(res);return res};
    sp.onclick=preview;
    $("#smsSave").onclick=()=>{const list=isList();const all=preview();const res=all.filter(r=>r.ok);if(!res.length){toast("추가할 수 있는 거래가 없습니다");return}
      const r=addTx(res,list?"capture":"sms");pendingSms="";$("#smsIn").value="";
      const skipped=all.filter(x=>x.listCancel).length;
      toast(`${r.added}건 추가${r.dup?` · 중복 ${r.dup}건 제외`:""}${r.offset?` · 취소 상계 ${r.offset}건`:""}${skipped?` · 거래취소 ${skipped}건 제외`:""}${all.length>res.length+skipped?` · 확인 필요 ${all.length-res.length-skipped}건`:""}`)};
    if($("#smsIn").value.trim())preview();
    $("#csvFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const out=$("#csvOut");out.innerHTML=`<p class="cap">읽는 중…</p>`;
      try{const p=mapRows(await fileRows(f),$("#fileInst").value);
        if(p.err){out.innerHTML=`<p class="note alert">${esc(p.err)}</p>`;return}
        const r=addTx(p.rows,/\.pdf$/i.test(f.name)?"pdf":"csv");
        out.innerHTML=`<p class="note">${esc(f.name)} · ${p.rows.length}건 읽음 · <b>${r.added}건 추가</b> · 중복 ${r.dup}건 제외${r.offset?` · 취소 상계 ${r.offset}건`:""}${r.paired?` · 내 계좌 간 이체 ${r.paired}쌍`:""}${p.skipped?` · 건너뜀 ${p.skipped}줄`:""}<br><span class="cap">인식한 열: ${esc(p.header.join(", "))}</span></p>`;
      }catch(err){out.innerHTML=`<p class="note alert">${esc(err.message||"파일을 읽지 못했습니다")}</p>`}
      e.target.value=""};
  }
  const bf=$("#budgetForm");if(bf)bf.onsubmit=e=>{e.preventDefault();const v=Math.max(0,Math.round(+$("#budgetIn").value||0));S.budget.total=v||S.budget.total;save();toast("월 예산을 "+won(S.budget.total)+"으로 저장했습니다")};
  document.querySelectorAll("[data-ana]").forEach(b=>b.onclick=()=>{S.anaN=+b.dataset.ana;save();render()});
  const sf=$("#selfForm");if(sf)sf.onsubmit=e=>{e.preventDefault();const names=v=>v.split(/[,，]/).map(s=>s.replace(/\s/g,"")).filter(Boolean);
    S.self=names($("#selfIn").value);S.family=names($("#famIn").value);
    const n=reclassify(t=>["미분류","이체","가족 생활비"].includes(t.category));save();toast(`이름 ${S.self.length+S.family.length}개 저장 · ${n}건 다시 분류`);render()};
  const eb=$("#exportBtn");if(eb){eb.onclick=exportBackup;$("#importFile").onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=""}}
}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;if(tab!=="import")pendingSms=null;render()};

/* ---------- share intake (Android 공유 / 자동화) ---------- */
function intake(){
  let text=null,auto=false;
  try{
    const q=new URLSearchParams(location.search);
    const h=new URLSearchParams(location.hash.slice(1));
    const parts=[q.get("title"),q.get("text"),h.get("sms")].filter(Boolean);
    if(parts.length){text=parts.join("\n");auto=q.get("auto")==="1"||h.get("auto")==="1"}
    if(parts.length||q.has("share"))history.replaceState(null,"",location.pathname);
  }catch(e){}
  if(text==null)return;
  if(S.sample){fresh()}
  tab="import";
  if(auto){const res=parseSMS(text).filter(r=>r.ok).map(r=>({...r,inst:r.inst||instFromIssuer(r.issuer)}));
    if(res.length){const r=addTx(res,"sms");pendingSms="";setTimeout(()=>toast(`문자 ${r.added}건 자동 추가${r.dup?` · 중복 ${r.dup}건`:""}`),300);tab="tx";return}}
  pendingSms=text;
}

// 분류 규칙이 바뀌면 미분류 거래만 다시 분류 (사용자가 직접 고른 카테고리는 건드리지 않음)
function reclassify(pred){let n=0;S.tx.forEach(t=>{if((t.refund&&t.cancelOf)||t.xfer)return;if(!pred(t))return;
  let c=classify(t.key||t.merchant,t.inst,t.amount);
  if(isBank(t.inst)&&Math.abs(t.amount)>=BIG_MOVE&&!["수입","이체"].includes(c)&&!ruleHit(t.merchant))c="자산 거래";
  if(c!==t.category){t.category=c;n++}});
  n+=pairTransfers(S.tx);return n}
S=load()||seed();
if(!S.month)S.month=ym(today);
if(!S.sample&&(S.kwVer||1)<KW_VER){reclassify(t=>t.category==="미분류"||(t.category==="가족 생활비"&&t.amount>0));S.kwVer=KW_VER;save()}
if(!S.inst.some(i=>i.id==="wc")&&S.sample){S=seed()}
intake();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if("serviceWorker" in navigator&&/^https:|localhost/.test(location.origin)&&!/claude\.ai|claudeusercontent/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
window.__hb={parseSMS,mapRows,parseCSVText,classify:m=>classify(m)};
})();
</script>
